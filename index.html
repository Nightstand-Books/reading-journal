<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d5b44" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1813" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ashlin's reading journal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<title>Nightstand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500&family=Bebas+Neue&family=Cinzel:wght@500&family=Playfair+Display:wght@500;600&family=Special+Elite&family=Lora:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@400;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a library study — header + tabs; dashboard = goal ring & tiles, a wooden bookshelf of the year's finished books, then charts; library = cover wall */
:root{
  --bg:#eceee5; --surface:#f7f8f2; --sunk:#e2e6da; --ink:#1c2a22; --muted:#5a6a5f; --line:#d0d7c9;
  --accent:#2d5b44; --accent-ink:#f4f6ef; --brass:#a57724; --rust:#a4472f;
  --wood1:#7b502f; --wood2:#5b3a20; --shelf-back:#dfe4d6;
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-body:"Karla", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Bradley Hand", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1813; --surface:#15231c; --sunk:#0b140f; --ink:#e5ebdd; --muted:#98a99c; --line:#283a30;
  --accent:#86bb99; --accent-ink:#0e1813; --brass:#d6aa55; --rust:#d77f62;
  --wood1:#6a4327; --wood2:#452a16; --shelf-back:#0a120e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1813; --surface:#15231c; --sunk:#0b140f; --ink:#e5ebdd; --muted:#98a99c; --line:#283a30;
  --accent:#86bb99; --accent-ink:#0e1813; --brass:#d6aa55; --rust:#d77f62;
  --wood1:#6a4327; --wood2:#452a16; --shelf-back:#0a120e; color-scheme:dark }

*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--fw-display,400);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(28px,4.5vw,40px);line-height:1.05}
h2{font-size:21px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:18px}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rust);border-color:color-mix(in srgb,var(--rust) 45%,transparent);background:transparent}
.btn.danger.armed{background:var(--rust);color:var(--surface);border-color:var(--rust)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;cursor:pointer}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}

.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--brass) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);padding:10px 14px;border-radius:var(--r);margin-bottom:18px;font-size:14px}

/* dashboard */
.dash{display:grid;gap:18px}
.row1{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:18px}
@media (max-width:820px){.row1{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring text{fill:var(--ink)}
.goal .big{font-family:var(--f-display);font-size:34px;line-height:1}
.goal .pace{color:var(--muted);font-size:13.5px;margin-top:6px}
.goal-edit{display:flex;gap:6px;align-items:center;margin-top:10px}
.goal-edit input{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(var(--tc,3),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tiles .tile{grid-column:span var(--span,1)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(min(var(--tc,3),2),minmax(0,1fr))}.tiles .tile{grid-column:span 1}.tiles .tile.odd-last{grid-column:1 / -1}}
.row1.solo,.row2.solo,.row3.solo,.row4.solo{grid-template-columns:1fr}
.dash-foot{display:flex;justify-content:center;margin-top:4px}
.dc-group{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.tile .v small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.tile .stars{color:var(--brass);letter-spacing:1px;font-size:14px}

.row2{display:grid;grid-template-columns:1fr minmax(260px,340px);gap:18px}
@media (max-width:920px){.row2{grid-template-columns:1fr}}
.shelf{display:flex;flex-wrap:wrap;align-content:flex-start;gap:0;padding:10px 14px 0;border-radius:8px;min-height:170px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 136px, var(--wood1) 136px 146px, var(--wood2) 146px 152px),
    var(--shelf-back);
  box-shadow:inset 0 0 0 1px var(--line)}
.slot{height:152px;display:flex;align-items:flex-end;padding-bottom:16px}
.spine{width:var(--w);height:var(--ht);border:0;border-radius:2px 2px 1px 1px;cursor:pointer;position:relative;padding:8px 0;
  background:linear-gradient(90deg,hsl(var(--h) 36% 20%),hsl(var(--h) 38% 33%) 28%,hsl(var(--h) 36% 27%) 70%,hsl(var(--h) 36% 19%));
  color:hsl(var(--h) 30% 92%);writing-mode:vertical-rl;font-family:var(--f-display);font-size:var(--fs,10.5px);line-height:1.08;overflow:hidden;white-space:normal;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.22),inset 1px 0 0 rgba(255,255,255,.08),-3px 0 4px -2px rgba(0,0,0,.45);transition:transform .15s ease}
.spine::before,.spine::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:hsl(var(--h) 40% 70% / .55)}
.spine.ff-sans{font-family:"Karla",system-ui,sans-serif;font-weight:700}
.spine.ff-tall{font-family:"Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.03em}
.spine.ff-elegant{font-family:"Playfair Display",Georgia,serif}
.spine.ff-roman{font-family:"Cinzel",Georgia,serif}
.spine.ff-type{font-family:"Special Elite","Courier New",monospace}
.spine.ff-hand{font-family:"Caveat",cursive}
.spine-edit{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
@media (max-width:600px){.spine-edit{grid-template-columns:1fr}}
.shelf.preview{justify-content:center;min-height:152px;padding:0 14px}
.spine-stage p{text-align:center;margin:8px 0 0}
.sp-cover{margin:14px auto 0;width:140px;border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 18px -10px rgba(0,0,0,.5)}
.sp-cover img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.sp-cover.picking{cursor:crosshair;outline:2px solid var(--accent);outline-offset:3px}
.sp-pick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sp-pick .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spine-controls{display:flex;flex-direction:column;gap:14px}
.sc-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.sc-row>label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sc-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.sc-ctl input[type=color]{width:44px;height:32px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.sc-ctl input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--accent)}
.sc-auto{flex:0 0 58px;display:inline-flex}
@media (min-width:601px){.sc-range{flex-wrap:nowrap}}
.sc-ctl select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
.sc-val{font-size:13px;min-width:44px;font-variant-numeric:tabular-nums}
.sc-num{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.sc-num input{width:62px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sc-tag{font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.sc-hint{font-size:12.5px;color:var(--muted);grid-column:2}
.spine::before{top:6px}.spine::after{bottom:6px}
.spine span{display:block;max-height:100%;max-width:100%;overflow:hidden;overflow-wrap:anywhere;text-align:center;padding-block:7px;margin:0 auto}
.spine.cc{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 68%,#000),var(--c) 28%,color-mix(in srgb,var(--c) 90%,#000) 70%,color-mix(in srgb,var(--c) 62%,#000));color:var(--ct)}
.spine.cc::before,.spine.cc::after{background:color-mix(in srgb,var(--ct) 50%,transparent)}
.spine:hover,.spine:focus-visible{transform:translateY(-6px)}
.shelf.arranging .slot[data-id]{touch-action:none;cursor:grab}
.shelf.arranging .spine{cursor:grab;outline:1px dashed color-mix(in srgb,var(--brass) 70%,transparent);outline-offset:2px}
.shelf.arranging .spine:hover{transform:none}
.shelf .slot.dragging{opacity:.55}
.shelf .slot.dragging .spine{transform:translateY(-10px)}
.arrange-hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.bookcase{border:8px solid var(--wood1);border-top-width:10px;border-bottom-width:6px;border-radius:6px;background:var(--shelf-back);box-shadow:0 10px 20px -14px rgba(0,0,0,.55)}
.bookcase .shelf{border-radius:0;box-shadow:none;min-height:152px;padding:0 8px}
.bookcase .shelf-head{margin:10px 8px 2px}
.shelf-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.shelf.editing{outline:1px dashed color-mix(in srgb,var(--muted) 55%,transparent);outline-offset:-4px}
.shelf.target{outline:2px solid color-mix(in srgb,var(--brass) 75%,transparent)}
.shelf-drop{height:136px;display:flex;align-items:center;margin:0 auto;color:var(--muted);font-size:13px;font-style:italic}
.slot.deco svg{display:block;max-width:none}
.slot.bookend{margin:0 1px}
.slot.gap{width:var(--gw)}
.shelf.editing .slot.gap{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--muted) 30%,transparent) 6px 7px);background-clip:content-box}
.shelf.editing .slot[data-item]{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.shelf.editing .spine:hover{transform:none}
.slot.sel .spine,.slot.sel svg{outline:2px solid var(--brass);outline-offset:2px}
.slot.gap.sel{outline:2px solid var(--brass);outline-offset:-2px}
.slot.dragging{opacity:.5}
.tray{margin-top:14px}
.tray-row{border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);margin-top:6px;padding:0 8px;min-height:152px}
.shelf-tools{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.itembar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.deco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.deco-tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;min-height:140px}
.deco-tile:hover,.deco-tile:focus-visible{border-color:var(--brass)}
.deco-tile svg{max-height:96px;width:auto}
.deco-tile .pair{display:flex;gap:18px;align-items:flex-end}
.deco-tile>span:last-child{font-size:12.5px}
.appearance{display:flex;flex-direction:column;gap:14px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.ap-row{display:flex;flex-direction:column;gap:8px}
.ap-l{font-size:13px;font-weight:700}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.theme-sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px}
.theme-sw .dots{display:flex}
.theme-sw .dots i{width:18px;height:18px;border-radius:50%;margin-left:-5px;border:2px solid var(--surface)}
.theme-sw .dots i:first-child{margin-left:0}
.theme-sw[aria-pressed="true"],.font-sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.font-sw{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.font-sw .fd{font-size:28px;line-height:1;min-width:44px;text-align:center}
.font-sw .fl{display:flex;flex-direction:column;min-width:0}
.spine-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.spine-ctl input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.plant{width:46px;height:auto;display:block}
.shelf-empty{display:flex;align-items:center;justify-content:center;width:100%;height:136px;color:var(--muted);font-style:italic;text-align:center;padding:0 20px}

.reading-list{display:flex;flex-direction:column;gap:14px}
.reading-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.reading-item.ns-drag{grid-template-columns:52px 1fr 18px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:12px;padding:8px 10px;margin:0 -10px;transition:background .15s, box-shadow .15s}
.reading-list:has(.ns-drag){gap:2px}
@media (hover:hover){.reading-item.ns-drag:hover{background:color-mix(in srgb, var(--accent) 8%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);cursor:grab}.reading-item.ns-drag:hover .ns-grip{opacity:1;color:var(--ink)}}
.reading-item.ns-drag:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.reading-item.ns-drag img{-webkit-user-drag:none;pointer-events:none}
.ns-grip{color:var(--muted);font-size:14px;letter-spacing:-3px;opacity:.45;cursor:grab;text-align:center}
.reading-item.ns-drag:hover .ns-grip{opacity:.9}
.reading-item.dragging{opacity:.6;background:var(--sunk);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
body.ns-dragging,body.ns-dragging *{cursor:grabbing !important}
.ns-hint{margin:10px 0 0}
.reading-item .t{font-weight:700;line-height:1.25}
.reading-item .a{color:var(--muted);font-size:13px}
.fmt{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid currentColor}
.fmt svg{width:14px;height:14px;flex:none}
.fmt-print{color:var(--accent)} .fmt-ebook{color:var(--brass)} .fmt-audiobook{color:var(--rust)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:99px}
.mini{font-size:12.5px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);font-size:14px}

.row3{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:820px){.row3{grid-template-columns:1fr}}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .b.now{fill:var(--brass)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(80px,120px) 1fr 26px;gap:10px;align-items:center;font-size:13.5px}
.hb .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .trk{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hb .trk i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .n{text-align:right;font-weight:700}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 8px;background:var(--sunk)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.upnext{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.upnext .cover-btn{flex:0 0 74px}
.quick-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.upnext-check{margin:0;align-items:center}
.hm{width:58px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-variant-numeric:tabular-nums}
.hm-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.f .spd input{width:70px;flex:0 0 70px;text-align:center;-moz-appearance:textfield}.spd input::-webkit-inner-spin-button,.spd input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.own-row{cursor:pointer}.own-row input{accent-color:var(--accent)}
.own-ic{width:22px;height:22px;flex:0 0 auto;color:var(--muted)}
.own-row:has(.switch:checked) .own-ic{color:var(--accent)}
.own-t{display:flex;flex-direction:column;min-width:0}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spd-b{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.spd-b:hover{border-color:var(--muted)}

html,body{margin:0}
body{min-height:100vh;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

.signin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}

.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:48px;height:48px;font-size:20px}
.acct{display:flex;align-items:center;gap:12px}

<script>
(() => {
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const FORMATS = ["Print","Ebook","Audiobook"];

const GENRES = ["Literary fiction","Historical fiction","Romance","Romantasy","Fantasy","Science fiction","Mystery / thriller","Contemporary","Memoir","Nonfiction","Education","Young adult","Middle grade","Children's","Poetry"];
const HUES = [150,95,40,15,355,320,265,220,195,28];
const today = () => new Date().toLocaleDateString("en-CA");
const thisYear = new Date().getFullYear();

const S = { tab:"dash", year:thisYear, books:[], settings:{goals:{}}, loaded:false, db:null, assets:null, canWrite:true, noDb:false,
  q:"", fStatus:"all", fYear:"all", fGenre:"", fFormat:"", fOwned:"", sort:"added", openId:null, editing:false, draft:null, editingGoal:false, armedDelete:false, busy:false, err:"",
  sample:null, imp:null, sum:null, challenges:[], cm:null, pendingSlot:null, fChal:"", coverMap:{}, user:null, unsubs:[], ol:null };
const PACES = ["slow","medium","fast"];
let shelfDrag = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };
const hueOf = b => (b.hue ?? HUES[hash(b.title||"") % HUES.length]);
const yr = d => d ? Number(String(d).slice(0,4)) : null;
const fmtDate = d => { if(!d) return "—"; const [y,m,dd]=String(d).split("-").map(Number);
  if (!m) return `${y} (estimate)`; if (!dd) return `${MONTHS[m-1]} ${y} (estimate)`; return `${MONTHS[m-1]} ${dd}, ${y}`; };
const isEstDate = d => !!d && String(d).length < 10;
const stars = r => { r = Number(r)||0; if(!r) return ""; const f=Math.floor(r); return "★".repeat(f) + (r-f>=.5?"½":""); };
const money = n => "$" + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});

function toast(msg, opts={}){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("hint", !!opts.hint);
  t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), opts.ms || 2200); }

/* ---------- covers & spines ---------- */
function cover(b, cls=""){
  const h = hueOf(b);
  const src = (b.coverId && S.coverMap[b.coverId]) || (b.olCover ? `https://covers.openlibrary.org/b/id/${encodeURIComponent(b.olCover)}-M.jpg` : "") || b.coverUrl || "";
  const img = src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="cover ${cls}" style="--h:${h}"><div class="band"></div><div class="ct">${esc(b.title||"Untitled")}</div><div class="ca">${esc(b.author||"")}</div>${img}</div>`;
}
function coverSrcOf(b){ return (b.coverId && S.coverMap[b.coverId]) || (b.olCover ? `https://covers.openlibrary.org/b/id/${encodeURIComponent(b.olCover)}-M.jpg` : "") || b.coverUrl || ""; }
const SPINE_FONTS = {
  serif:   {label:"Classic serif", adv:.6,  boost:0},
  sans:    {label:"Clean sans",    adv:.56, boost:0},
  tall:    {label:"Tall caps",     adv:.42, boost:2},
  elegant: {label:"Elegant serif", adv:.6,  boost:0},
  roman:   {label:"Engraved caps", adv:.74, boost:-.5},
  type:    {label:"Typewriter",    adv:.64, boost:0},
  hand:    {label:"Handwritten",   adv:.44, boost:3}
};
// Auto width follows the page count: thin for short books, chunky for long ones
// Square-root scale: a big book is still visibly thicker, but doubling the pages doesn't double the width
function autoWidth(b){ const pages = Number(b.pages) || 300; return Math.round(Math.max(14, Math.min(42, 4 + 1.3 * Math.sqrt(pages)))); }
function autoHeight(b){ return 106 + (hash(String(b.title||"")) % 20); }
function spineLayout(b){
  const title = String(b.title || "Untitled");
  const fk = SPINE_FONTS[b.spineFont] ? b.spineFont : "serif", font = SPINE_FONTS[fk];
  const ht = Number(b.spineH) || autoHeight(b);
  const len = ht - 24;
  const need = fs => { const per = Math.max(4, Math.floor(len / (fs * font.adv))); const cols = Math.ceil(title.length / per); return {cols, w: cols * fs * 1.12 + 9}; };
  let fs = (title.length > 44 ? 9.5 : 10.5) + font.boost, w;
  if (Number(b.spineW)) { w = Number(b.spineW); while (fs > 7 && need(fs).w > w) fs -= .5; }

    const w0 = autoWidth(b);
    while (fs > 8.5 && need(fs).w > w0) fs -= .5;          // shrink the lettering a little before widening
    while (fs > 7.5 && need(fs).w > 42) fs -= .5;
    w = Math.min(42, Math.max(w0, Math.round(need(fs).w)));
  }
  return {title, fk, ht, fs, w};
}
function spine(b, i, attrs="", extra=""){
  const L = spineLayout(b);

}
function textOn(hex){ const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), bb=parseInt(hex.slice(5,7),16); return (0.2126*r+0.7152*g+0.0722*bb)/255 > .58 ? "#1c1c1c" : "#fbf7ee"; }
function hslHex(h, s, l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join(""); }
function spineHexOf(b){ const src = coverSrcOf(b); if (b.spineColor && (b.spineManual || b.spineFor === srcKey(src))) return b.spineColor; return hslHex(hueOf(b), 37, 29); }
const PLANT = `<div class="slot" aria-hidden="true"><svg class="plant" viewBox="0 0 46 70"><path d="M23 44 C10 40 4 30 6 18 C14 22 20 30 23 44Z" fill="#4f8a5f"/><path d="M23 44 C34 38 42 28 40 14 C31 20 25 30 23 44Z" fill="#3f7550"/><path d="M23 44 C20 30 22 16 28 6 C31 18 28 32 23 44Z" fill="#5f9c6c"/><path d="M11 44 H35 L32 68 H14 Z" fill="#b8693f"/><rect x="9" y="42" width="28" height="6" rx="2" fill="#c97a4c"/></svg></div>`;

/* ---------- derived data ---------- */

// Layout for a year: { rows: [[item, ...], ...], tray: [bookId, ...] }
// item: {t:"b", id} book · {t:"d", k, u} decor · {t:"e", k, f, u} bookend (f = flipped) · {t:"g", w, u} empty space
function shelfLayout(y){
  const fin = finishedIn(y), ids = new Set(fin.map(b => b.id));
  const saved = S.settings.shelves && S.settings.shelves[y];
  let rows, tray;
  if (saved && Array.isArray(saved.rows)){
    rows = saved.rows.map(r => (r.items || []).filter(it => it && (it.t !== "b" || ids.has(it.id))));
    tray = (saved.tray || []).filter(id => ids.has(id));
  } else {
    const ord = (S.settings.shelfOrder && S.settings.shelfOrder[y]) || [];
    const pos = id => { const i = ord.indexOf(id); return i < 0 ? 1e6 : i; };
    const books = [...fin].sort((a,b) => pos(a.id) - pos(b.id) || (a.finishDate||"").localeCompare(b.finishDate||""));
    rows = [[...books.map(b => ({t:"b", id:b.id})), {t:"d", k:"plant", u:"plant0"}]];
    tray = [];
  }
  if (!rows.length) rows = [[]];
  const placed = new Set(tray); rows.forEach(r => r.forEach(it => { if (it.t === "b") placed.add(it.id); }));
  const missing = [...fin].sort((a,b) => (a.finishDate||"").localeCompare(b.finishDate||"")).filter(b => !placed.has(b.id));
  if (missing.length){
    const last = rows[rows.length - 1]; let at = last.length;
    while (at > 0 && (last[at-1].t === "d" || (last[at-1].t === "e" && last[at-1].f))) at--;   // keep new books inside the bookend / before trailing decor
    last.splice(at, 0, ...missing.map(b => ({t:"b", id:b.id})));
  }
  return {rows, tray};
}

/* ---------- switch cover ---------- */
const SRC_ORDER = {"Hardcover":0, "Google Books":1, "Open Library":2};
const olCoverUrl = id => `https://covers.openlibrary.org/b/id/${encodeURIComponent(id)}-M.jpg?default=false`;
async function findCovers(q){
  const out = [], seen = new Set();
  const add = (url, src, label, color) => { if (!url) return; const k = url.replace(/[?&]default=false/,""); if (seen.has(k)) return; seen.add(k); out.push({url, src, label: label||"", color: color||""}); };
  const jobs = [];
  if (hcProxy()) jobs.push(hcSearch(q, null, 8).then(r => r.forEach(d => add(d.cover_url, "Hardcover", d.title, d._color))).catch(()=>{}));
  jobs.push(gbSearch(q, null, 20).then(r => r.forEach(d => add(d.cover_url, "Google Books", d.title))).catch(()=>{}));
  jobs.push((async () => {
    const j = await getJSON(`${OL}/search.json?q=${encodeURIComponent(q)}&fields=key,title,cover_i&limit=5`);
    const docs = j.docs || [];
    docs.forEach(d => { if (d.cover_i) add(olCoverUrl(d.cover_i), "Open Library", d.title); });
    if (docs[0]?.key){
      const e = await getJSON(`${OL}${docs[0].key}/editions.json?limit=60`);
      (e.entries || []).forEach(ed => (ed.covers || []).filter(c => c > 0).forEach(c => add(olCoverUrl(c), "Open Library", ed.title)));
    }
  })().catch(()=>{}));
  await Promise.all(jobs);
  return out.sort((a,b) => SRC_ORDER[a.src] - SRC_ORDER[b.src]).slice(0, 60);
}
async function runCoverSearch(){
  const m = S.cm; if (!m || m.type !== "covers") return;
  m.loading = true; m.results = []; m.err = ""; renderModal();
  const token = (m.token = (m.token||0) + 1);
  try { const r = await findCovers(m.q); if (S.cm !== m || m.token !== token) return; m.results = r; }
  catch(_) { m.err = "The cover sources didn't answer. Try again in a moment."; }
  m.loading = false; if (S.cm === m) renderModal();
}

  return { theme: THEMES[saved.theme] ? saved.theme : "forest", mode: ["light","dark","auto"].includes(saved.mode) ? saved.mode : "auto", font: FONT_SETS[saved.font] ? saved.font : "classic" };

function applyLook(look = currentLook()){
  const dark = look.mode === "dark" || (look.mode === "auto" && darkMQ && darkMQ.matches);

  TOKEN_KEYS.forEach(k => root.style.setProperty("--" + k, pal[k]));
  root.style.setProperty("color-scheme", dark ? "dark" : "light");

  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", dark ? pal.bg : pal.accent));
  try { localStorage.setItem("ns-look", JSON.stringify(look)); } catch {}
}

function nsStart(d){ d.started = true; d.it.classList.add("dragging"); document.body.classList.add("ns-dragging"); if (navigator.vibrate) try { navigator.vibrate(10); } catch(_){} }

  if (over && over !== d.it){ const r = over.getBoundingClientRect(); over.parentNode.insertBefore(d.it, y > r.top + r.height / 2 ? over.nextSibling : over); }
}

async function renameGenre(i, val){

}

/* ---------- audiobook editions (Hardcover) ---------- */
async function hcBookId(b){
  if (String(b.olKey||"").startsWith("hc:")) return Number(String(b.olKey).slice(3));
  const d = await hcFind(String(b.title).replace(/\(.*?\)/g,"").split(":")[0].trim(), b.author);
  return d ? Number(String(d.key).slice(3)) : 0;
}
async function runEditionSearch(){
  const m = S.cm; if (!m || m.type !== "aed") return;
  const b = S.books.find(x => x.id === m.id); if (!b) return;
  m.loading = true; m.err = ""; renderModal();
  const opts = [];
  try {
    const hid = await hcBookId(b);
    if (hid){
      const j = await getJSON(`${hcProxy()}?editions=${hid}`, null, 12000);
      (j.editions || []).forEach(e => {
        const what = e.info || (e.title && normT(e.title) !== normT(b.title) ? e.title : "") || "Standard audiobook";
        const sub = [e.publisher, e.narrators && e.narrators.length ? "read by " + e.narrators.join(", ") : "", e.year].filter(Boolean).join(" · ");
        opts.push({seconds: e.seconds, label: what, sub, tag: [what, e.publisher].filter(Boolean).join(" · ")});
      });
    }
    // Some adaptations (dramatized versions especially) are listed on Hardcover as their own book
    const t = String(b.title).replace(/\(.*?\)/g,"").split(":")[0].trim();
    const more = await hcSearch(`${t} ${b.author||""}`.trim(), null, 8).catch(() => []);
    more.filter(d => d._audio && Number(String(d.key).slice(3)) !== hid && normT(d.title).slice(0,12) === normT(t).slice(0,12))
      .forEach(d => opts.push({seconds: d._audio, label: d.title, sub: "Listed separately on Hardcover", tag: d.title}));
  } catch(e){ m.err = "Hardcover didn't answer. Try again in a moment, or type the length in yourself."; }
  const seen = new Set(); m.opts = opts.filter(o => { const k = Math.round(o.seconds/60) + "|" + o.label + "|" + o.sub; if (seen.has(k)) return false; seen.add(k); return true; });
  m.loading = false; if (S.cm === m) renderModal();
}

/* ---------- audiobook time ---------- */
const isAudio = b => b && b.format === "Audiobook";
const spdOf = b => isAudio(b) ? (Number(b.audioSpeed) || (b.status === "finished" ? 1 : 0)) : 0;   // finished audiobooks count as 1× unless a speed was set
const fmtSpeed = v => `${Number(v).toFixed(2).replace(/0$/, "").replace(/\.0$/, ".0")}×`;
function fmtDur(sec){ sec = Math.max(0, Math.round(Number(sec)||0)); const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60); if (!h) return `${m} min`; return m ? `${h} hr ${m} min` : `${h} hr`; }
const hmToSec = (h, m) => { const H = Number(h)||0, M = Number(m)||0; return H || M ? H*3600 + M*60 : 0; };
const secH = sec => sec ? Math.floor(sec/3600) : "", secM = sec => sec ? Math.round((sec%3600)/60) : "";
// progress for any book: audiobooks by time when a length is known, otherwise pages
function progressOf(b){
  if (isAudio(b) && Number(b.audioSeconds)){
    const tot = Number(b.audioSeconds), cur = Math.min(tot, Number(b.audioPos)||0), pc = Math.round(cur/tot*100);
    return {audio:true, pc, line:`${fmtDur(cur)} of ${fmtDur(tot)} · ${pc}%`, left:`${fmtDur(tot-cur)} left`};
  }
  if (isAudio(b) && !Number(b.currentPage)) return {audio:true, pc:0, line:"Add the audiobook length to track time", left:""};
  const p = Number(b.pages)||0, c = Math.min(p||Infinity, Number(b.currentPage)||0), pc = p ? Math.min(100, Math.round(c/p*100)) : 0;
  return {audio:false, pc, line: p ? `Page ${c} of ${p} · ${pc}%` : (isAudio(b) ? "Add the audiobook length to track time" : "Add a page count to track progress"), left: p ? `${Math.max(0,p-c)} pages left` : ""};
}

/* ---------- spine colors from covers ---------- */
// Short, stable key for a cover source (uploaded photos are long data URLs)
function srcKey(src){ return !src ? "" : src.startsWith("data:") ? "photo:" + hash(src) : src; }
function dominantColor(img){
  const W = 24, H = 36, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data; // throws if the image host doesn't allow reading
  const buckets = new Map();
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 200) continue;
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    const sat = mx ? (mx - mn) / mx : 0;
    // favor colorful pixels a little over plain white/black areas
    const weight = 1 + sat * 1.5 - (mx > 240 && sat < .08 ? .6 : 0) - (mx < 25 ? .4 : 0);
    const k = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5);
    const e = buckets.get(k) || {w:0, r:0, g:0, b:0};
    e.w += weight; e.r += r*weight; e.g += g*weight; e.b += b*weight; buckets.set(k, e);
  }
  let best = null; for (const e of buckets.values()) if (!best || e.w > best.w) best = e;
  if (!best || best.w <= 0) return null;
  let r = best.r/best.w, g = best.g/best.w, b = best.b/best.w;
  // keep spines from being glaring: pull very light colors down a bit
  const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  if (lum > .82){ r *= .86; g *= .86; b *= .86; }
  const hex = "#" + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,"0")).join("");
  const l2 = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  return {color: hex, text: l2 > .58 ? "#1c1c1c" : "#fbf7ee"};
}
function loadCors(src){
  return new Promise((res, rej) => {
    const img = new Image(); if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
    const t = setTimeout(() => rej(new Error("slow")), 12000);
    img.onload = () => { clearTimeout(t); res(img); }; img.onerror = () => { clearTimeout(t); rej(new Error("no read")); };
    img.src = src;
  });
}
const spineQueue = new Set(); let spineBusy = false;
function queueSpineColors(books){
  if (!S.canWrite || !S.db) return;
  books.forEach(b => { if (b.spineManual) return; const k = srcKey(coverSrcOf(b)); if (k && b.spineFor !== k && !S.spineTried?.[b.id + k]) spineQueue.add(b.id); });
  if (!spineBusy) runSpineQueue();
}
async function runSpineQueue(){
  spineBusy = true; S.spineTried = S.spineTried || {};
  while (spineQueue.size){
    const id = spineQueue.values().next().value; spineQueue.delete(id);
    const b = S.books.find(x => x.id === id); if (!b || b.spineManual) continue;
    const src = coverSrcOf(b), k = srcKey(src); if (!k || b.spineFor === k) continue;
    S.spineTried[id + k] = true;
    let out = null;
    try { out = dominantColor(await loadCors(src)); } catch(_) { out = null; }
    if (!out && !navigator.onLine) continue;
    // remember the attempt either way, so a cover that can't be read isn't retried on every device
    const {id:_i, ...rest} = b;
    try { await saveBook(id, {...rest, spineColor: out ? out.color : "", spineText: out ? out.text : "", spineFor: k}); } catch(_) {}
    await new Promise(r => setTimeout(r, 150));
  }
  spineBusy = false;
}

function dashHTML(){

  const y = S.year, fin = finishedIn(y);
  const goal = Number(S.settings.goals?.[y]) || 0;
  const pages = fin.reduce((s,b)=>s+(Number(b.pages)||0),0);
  const rated = fin.filter(b=>Number(b.rating)>0);
  const avg = rated.length ? rated.reduce((s,b)=>s+Number(b.rating),0)/rated.length : 0;
  const reading = nightOrdered(S.books.filter(b=>b.status==="reading"));
  const tbr = S.books.filter(b => b.status === "tbr"), un = upNextList();
  const spent = S.books.filter(b=>yr(b.dateAdded)===y).reduce((s,b)=>s+(Number(b.cost)||0),0);
  const both = rated.filter(b=>Number(b.communityRating)>0);
  let commLine = "";
  if (both.length){
    const ca = both.reduce((s,b)=>s+Number(b.communityRating),0)/both.length;
    const ya = both.reduce((s,b)=>s+Number(b.rating),0)/both.length;
    const d = ya-ca;

  }

  // goal ring
  const pct = goal ? Math.min(1, fin.length/goal) : 0;
  const R=46, C=2*Math.PI*R;
  let pace = "";
  if (goal){
    if (y===thisYear){
      const start=new Date(y,0,1), end=new Date(y+1,0,1), now=new Date();
      const expected = goal * (now-start)/(end-start);

      pace = fin.length>=goal ? "Goal reached. Everything else is a bonus." :
        Math.abs(diff) < 0.5 ? "Right on pace." :
        diff>0 ? `${Math.round(diff)} book${Math.round(diff)===1?"":"s"} ahead of pace.` :
        `${Math.round(-diff)} book${Math.round(-diff)===1?"":"s"} behind pace. ${goal-fin.length} to go.`;
    } else pace = fin.length>=goal ? "Goal reached." : `Finished ${fin.length} of ${goal}.`;
  }
  const goalEdit = S.editingGoal
    ? `<div class="goal-edit"><input id="goalInput" type="number" min="1" max="999" value="${goal||""}" aria-label="Books goal for ${y}"><button class="btn primary" data-act="save-goal">Save</button><button class="btn ghost" data-act="cancel-goal">Cancel</button></div>`

        <circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="10"/>
        <circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--brass)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 56 56)" ${pct?"":'stroke-opacity="0"'}/>
        <text x="56" y="54" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="26">${fin.length}</text>
        <text x="56" y="72" text-anchor="middle" font-size="11" style="fill:var(--muted)">${goal?"of "+goal:"books"}</text>
      </svg>
      <div><div class="big num">${goal?Math.round(pct*100)+"%":fin.length}</div>
        <div class="pace">${goal?esc(pace):"No goal set yet."}</div>${goalEdit}</div>
    </div></section>`;

  const hidden = new Set(S.settings.dashHidden || []), show = k => !hidden.has(k);
  const audioFin = fin.filter(b => isAudio(b) && Number(b.audioSeconds));
  const speedList = [...fin, ...(y === thisYear ? reading : [])].filter(b => spdOf(b));
  const dayOf = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d||"")) ? Date.UTC(+d.slice(0,4), +d.slice(5,7) - 1, +d.slice(8,10)) / 864e5 : null;
  const readSpans = fin.map(b => { const a = dayOf(b.startDate), z = dayOf(b.finishDate); return a !== null && z !== null && z >= a ? z - a + 1 : null; }).filter(v => v !== null);

  const audioNowList = reading.filter(b => isAudio(b) && Number(b.audioPos)), audioNow = audioNowList.length;
  const listened = audioFin.reduce((t, b) => t + Number(b.audioSeconds), 0) + (y === thisYear ? audioNowList.reduce((t, b) => t + Number(b.audioPos), 0) : 0);
  const tileList = [
    ["t-pages",   `<div class="tile"><span class="eyebrow">Pages read</span><span class="v num">${pages.toLocaleString()}</span></div>`],
    ["t-hours",   `<div class="tile"><span class="eyebrow">Hours listened</span><span class="v num">${(Math.round(listened/360)/10).toLocaleString()} <small>hr</small></span></div>`],
    ["t-speed",   `<div class="tile"><span class="eyebrow">Avg listening speed</span><span class="v num">${avgSpeed ? fmtSpeed(avgSpeed) : "—"}</span></div>`],
    ["t-days",    `<div class="tile"><span class="eyebrow">Avg days per book</span><span class="v num">${avgDays ? (avgDays < 10 ? Math.round(avgDays * 10) / 10 : Math.round(avgDays)) : "—"} ${avgDays ? `<small>day${Math.round(avgDays * 10) / 10 === 1 ? "" : "s"}</small>` : ""}</span></div>`],
    ["t-rating",  `<div class="tile"><span class="eyebrow">Average rating</span><span class="v num">${avg?avg.toFixed(1):"—"} <small>/ 5</small></span><span class="stars">${stars(Math.round(avg*2)/2)}</span>${commLine}</div>`],
    ["t-reading", `<div class="tile"><span class="eyebrow">Reading now</span><span class="v num">${reading.length}</span></div>`],
    ["t-tbr",     `<div class="tile"><span class="eyebrow">Want to read</span><span class="v num">${tbr.length}</span></div>`],
    ["t-spent",   `<div class="tile"><span class="eyebrow">Spent on books</span><span class="v num">${money(spent)}</span><span class="mini">books added in ${y}</span></div>`],
    ["t-length",  `<div class="tile"><span class="eyebrow">Avg length</span><span class="v num">${fin.length?Math.round(pages/fin.length):"—"} <small>pages</small></span></div>`],

  // monthly chart

  const maxV = Math.max(2, ...counts); const step = maxV<=4?1:Math.ceil(maxV/4);
  const W = show("genres") ? 600 : 1100, H=230, L=30, B=28, T=18, bw=(W-L-10)/12;
  const yv = v => H-B - (v/ (Math.ceil(maxV/step)*step)) * (H-B-T);
  let grid=""; for(let v=0; v<=Math.ceil(maxV/step)*step; v+=step) grid += `<line class="grid" x1="${L}" x2="${W-6}" y1="${yv(v)}" y2="${yv(v)}"/><text x="${L-8}" y="${yv(v)+4}" text-anchor="end">${v}</text>`;

  // genres + formats
  const src = fin.length ? fin : [];
  const gm = {}; src.forEach(b => { const g=b.genre||"Unsorted"; gm[g]=(gm[g]||0)+1; });
  const unsorted = gm["Unsorted"]||0; if (Object.keys(gm).length>1) delete gm["Unsorted"];

    const moodPanel = `<section class="panel"><div class="panel-h"><h2>How your ${y} reading felt</h2><span class="eyebrow">${withMood.length} book${withMood.length===1?"":"s"} with moods</span></div>

    const pc = {slow:0,medium:0,fast:0}; withPace.forEach(b=>{ const p=String(b.pace).toLowerCase(); if(p in pc) pc[p]++; });

  // Only the sections left showing are laid out; a panel whose partner is hidden spans the full width
  const rowOf = (cls, parts) => { parts = parts.filter(Boolean); return parts.length ? `<div class="${cls}${parts.length === 1 ? " solo" : ""}">${parts.join("")}</div>` : ""; };

    + rowOf("row3", [show("monthly") && chart, show("genres") && genres]) + rowOf("row4", [show("moods") && moodHTML, show("pace") && paceHTML]);

  return `<div class="dash">${body || `<div class="panel empty">Everything on the dashboard is hidden. Choose <b>Customize dashboard</b> to bring sections back.</div>`}${custom}</div>`;
}

/* library cover size: chosen as "books per row", so every row size has one fixed look.
   Change it with the slider, a two-finger pinch, or a trackpad pinch; remembered on this device. */
const GRID_GAP = 14, CARD_MIN = 80, CARD_MAX = 300;
const gridW = () => { const g = $("#grid"); return g ? g.clientWidth : 0; };
function colRange(W = gridW()){
  const lo = W < 600 ? 1 : Math.max(1, Math.ceil((W + GRID_GAP) / (CARD_MAX + GRID_GAP)));   // phones can go down to one big cover
  const hi = Math.max(lo, Math.floor((W + GRID_GAP) / (CARD_MIN + GRID_GAP)));
  return [lo, hi];
}
function gridCols(){
  const [lo, hi] = colRange();
  let n = S.gridCols; if (!n){ try { n = Number(localStorage.getItem("ns-grid-cols")) || 0; } catch(_){} }
  if (!n) n = Math.round((gridW() + GRID_GAP) / (170 + GRID_GAP)) || 2;   // about 150px covers to start
  return Math.max(lo, Math.min(hi, n));
}
function setGridCols(n, save){
  const [lo, hi] = colRange(); n = Math.max(lo, Math.min(hi, Math.round(n)));
  const changed = n !== S.gridCols; S.gridCols = n;
  const g = document.querySelector("#grid .grid");
  if (g){ const card = (gridW() - GRID_GAP * (n - 1)) / n;
    g.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`; g.style.setProperty("--card", card + "px"); g.classList.toggle("small", card < 110); }
  const l = $("#gridLabel"); if (l) l.textContent = `${n} per row`;
  const more = $('[data-act="grid-more"]'), fewer = $('[data-act="grid-fewer"]'); if (more) more.disabled = n >= hi; if (fewer) fewer.disabled = n <= lo;
  if (save) try { localStorage.setItem("ns-grid-cols", String(n)); } catch(_){}
  return changed;
}
window.addEventListener("resize", () => { if ($("#grid .grid")) setGridCols(S.gridCols || gridCols(), false); });
// two-finger pinch: spreading fingers means fewer, bigger books per row
let pinch = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 2 || !e.target.closest || !e.target.closest("#grid .grid")) return;
  const [a, b] = e.touches; pinch = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), start: gridCols()};
}, {passive:true});
document.addEventListener("touchmove", e => {
  if (!pinch || e.touches.length !== 2) return;
  if (e.cancelable) e.preventDefault();
  const [a, b] = e.touches, ratio = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d;
  setGridCols(pinch.start / ratio, false);
}, {passive:false});
document.addEventListener("touchend", e => { if (pinch && e.touches.length < 2){ pinch = null; setGridCols(S.gridCols, true); } });
["gesturestart","gesturechange"].forEach(n => document.addEventListener(n, e => { if (e.target.closest && e.target.closest("#grid .grid")) e.preventDefault(); }, {passive:false}));
// trackpad pinch shows up as ctrl + wheel; step one row size at a time
let wheelAcc = 0;
document.addEventListener("wheel", e => {
  if (!e.ctrlKey || !e.target.closest || !e.target.closest("#grid .grid")) return;
  e.preventDefault(); wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 40){ setGridCols(gridCols() + Math.sign(wheelAcc), true); wheelAcc = 0; }
}, {passive:false});
function renderGrid(){
  const g = $("#grid"); if(!g) return;

  if (S.fChal.startsWith("c:") && !S.challenges.some(c=>"c:"+c.id===S.fChal)) S.fChal = "";
  const chalOk = b => !S.fChal || (S.fChal==="any" ? !!inChal[b.id] : S.fChal==="none" ? !inChal[b.id] : (inChal[b.id]||[]).some(x=>"c:"+x.c.id===S.fChal));
  let list = S.books.filter(b =>
    (S.fStatus==="all" || b.status===S.fStatus) && yearOk(b) && (!S.fGenre || b.genre===S.fGenre) && (!S.fFormat || (b.format || "Print")===S.fFormat) && (!S.fOwned || (S.fOwned==="yes") === !!b.owned) && chalOk(b) && (!S.fTbr || shelvesFor(b.id).some(x => x.id===S.fTbr)) &&
    (!q || [b.title,b.author,b.genre,b.series,b.review,b.notes,b.quote,b.summary,(b.moods||[]).join(" "),(b.tags||[]).join(" ")].some(x => String(x||"").toLowerCase().includes(q))));
  const by = {

    rating:(a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0),
    community:(a,b)=>(Number(b.communityRating)||0)-(Number(a.communityRating)||0)}[S.sort];
  list.sort(by);
  if (!S.books.length){ g.innerHTML = `<div class="lib-empty"><h2 style="margin-bottom:6px">Your shelves are empty</h2><p>Add the book you're reading right now to get started.</p>${S.canWrite&&!S.noDb?`<button class="btn primary" data-act="new">+ Add a book</button>`:""}</div>`; return; }
  if (!list.length){ g.innerHTML = `<div class="lib-empty">No books match those filters.</div>`; return; }
  g.innerHTML = `<div class="lib-head"><div class="lib-count num">${list.length} book${list.length===1?"":"s"}</div></div>
    <div class="grid">${list.map(b=>`
    <div class="card"><button class="cover-btn" data-act="open" data-id="${esc(b.id)}" aria-label="Open ${esc(b.title)}">${cover(b)}</button>
      <div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author||"")}</div></div>
      <div class="meta"><span class="status ${stClass(b.status)}">${esc(stLabel(b.status))}</span>${b.rating?`<span class="stars">${stars(b.rating)}</span>`:""}</div>${chalBadge(inChal[b.id])}${b.communityRating?`<div class="community num">Goodreads <b>${Number(b.communityRating).toFixed(2)}</b></div>`:""}
    </div>`).join("")}</div>`;
  setGridCols(gridCols(), false);

function dateFieldHTML(k, label, d){

  const tog = `<span class="dmode" role="radiogroup" aria-label="${label}: exact or estimate">${[["exact","Exact"],["est","Estimate"]].map(([m,l]) => `<label class="dm${mode===m?" on":""}"><input type="radio" name="${k}Mode" value="${m}" ${mode===m?"checked":""}>${l}</label>`).join("")}</span>`;
  const body = mode === "est"
    ? `<span class="dest"><select name="${k}M" aria-label="${label} month (optional)"><option value="">Any month</option>${MONTHS.map((n,i) => { const val = String(i+1).padStart(2,"0"); return `<option value="${val}" ${mm===val?"selected":""}>${n}</option>`; }).join("")}</select><input name="${k}Y" type="number" inputmode="numeric" min="1900" max="2100" placeholder="Year" value="${esc(yy||"")}" aria-label="${label} year"></span>`
    : `<input id="f-${k}" name="${k}Date" type="date" value="${esc(isEstDate(v) ? "" : v)}">`;
  return `<div class="f"><div class="dlabel"><label ${mode==="exact"?`for="f-${k}"`:""}>${label}</label>${tog}</div>${body}</div>`;
}

function readForm(){
  const f = $("#bookForm"); if(!f) return;
  const fd = new FormData(f);
  for (const [k,v] of fd.entries()) S.draft[k] = typeof v==="string" ? v : S.draft[k];
  if (f.elements.aLenH){ S.draft.audioSeconds = hmToSec(S.draft.aLenH, S.draft.aLenM) || ""; S.draft.audioPos = hmToSec(S.draft.aPosH, S.draft.aPosM) || ""; }
  ["aLenH","aLenM","aPosH","aPosM"].forEach(k => delete S.draft[k]);
  if (S.draft.genre === "__other") S.draft.genre = String(S.draft.genreOther||"").trim();
  if (S.draft.source === "__other") S.draft.source = String(S.draft.sourceOther||"").trim();
  delete S.draft.sourceOther;
  if (S.draft.store === "__other") S.draft.store = String(S.draft.storeOther||"").trim();
  delete S.draft.storeOther;
  ["start","finish"].forEach(k => {
    if (S.draft[k + "Mode"] === "est" && f.elements[k + "Y"]){
      const Y = String(S.draft[k + "Y"]||"").trim(), M = S.draft[k + "M"]||"";
      S.draft[k + "Date"] = /^\d{4}$/.test(Y) ? (M ? `${Y}-${M}` : Y) : "";
    }
    delete S.draft[k + "Y"]; delete S.draft[k + "M"];
  });
  delete S.draft.genreOther;
}

function clean(d){
  const n = v => v===""||v==null ? "" : Number(v);
  const {id:_id, example:_ex, startMode:_sm, finishMode:_fm, startY:_sy, startM:_smo, finishY:_fy, finishM:_fmo, ...rest} = d;
  const moods = Array.isArray(d.moods) ? d.moods : String(d.moods||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
  const o = {...rest, moods, series:(d.series||"").trim(), communityRating:n(d.communityRating), pace:d.pace||"", summary:(d.summary||"").trim(),
    title:d.title.trim(),author:(d.author||"").trim(),genre:(d.genre||"").trim(),format:d.format||"Print",status:d.status||"tbr",
    rating:n(d.rating),pages:n(d.pages),currentPage:n(d.currentPage),startDate:d.startDate||"",finishDate:d.finishDate||"",source:d.source||"",
    cost:n(d.cost),review:d.review||"",notes:d.notes||"",quote:d.quote||"",dateAdded:d.dateAdded||today(),hue:d.hue??null,coverId:d.coverId||null,
    createdAt:d.createdAt||Date.now()};
  if (o.summary !== (S.books.find(b=>b.id===_id)?.summary||"")) o.summaryBy = !o.summary ? "" : (o.summary === (d._autoSummary||"").trim() ? d.summaryBy : "me");
  delete o._autoSummary;
  if (o.status==="finished" && !o.finishDate) o.finishDate = today();
  if (o.status==="finished" && o.pages) o.currentPage = o.pages;
  if (o.status==="reading" && !o.startDate) o.startDate = today();
  return o;

  const status = {read:"finished","currently-reading":"reading","to-read":"tbr"}[shelf] || (/dnf|did-not-finish|abandon/.test(shelf) ? "dnf" : "tbr");
  const isbn = (r["isbn13"]||r["isbn"]||"").replace(/[="\s]/g,"");
  const tags = (r["bookshelves"]||"").split(",").map(x=>x.trim()).filter(x=>x && !["read","to-read","currently-reading"].includes(x));
  return { title, series, author:r["author"]||"", status, rating: num(r["my rating"]), communityRating: num(r["average rating"]),
    communityAsOf: today(), pages: num(r["number of pages"]), format: fmtOf(r["binding"]), isbn,
    year: r["original publication year"]||r["year published"]||"", finishDate: toDate(r["date read"]), dateAdded: toDate(r["date added"]),
    review: stripHtml(r["my review"]), notes: r["private notes"]||"", tags, owned: Number(r["owned copies"])>0 || undefined };
}
function mapStoryGraph(r){
  const st = (r["read status"]||"").toLowerCase();
  const status = {read:"finished","currently-reading":"reading","to-read":"tbr","did-not-finish":"dnf",paused:"reading"}[st] || "tbr";
  const datesRead = (r["dates read"]||"").split(",").pop().trim();
  const isbn = (r["isbn/uid"]||"").replace(/[^\dX]/gi,"");
  const author = (r["authors"]||"").split(",")[0].trim();
  const [title, series] = splitSeries(r["title"]);
  return { title, series, author, status, rating: num(r["star rating"]), format: fmtOf(r["format"]),
    isbn: (isbn.length===10||isbn.length===13) ? isbn : "",
    startDate: toDate(datesRead.split("-")[0]), finishDate: toDate(r["last date read"]) || (status==="finished" ? toDate(datesRead.split("-").pop()) : ""),
    dateAdded: toDate(r["date added"]), review: stripHtml(r["review"]),
    moods: (r["moods"]||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean), pace: (r["pace"]||"").toLowerCase(),
    drive: (r["character- or plot-driven?"]||"").toLowerCase().replace(/\s*-?\s*driven$/,""),
    contentWarnings: [r["content warnings"], r["content warning description"]].filter(Boolean).join("\n\n"),
    tags: (r["tags"]||"").split(",").map(x=>x.trim()).filter(Boolean), owned: /^yes/i.test(r["owned?"]||"") || undefined };
}
const normKey = (t,a) => String(t||"").toLowerCase().replace(/\(.*?\)/g,"").split(":")[0].replace(/[^a-z0-9]/g,"") + "|" + String(a||"").toLowerCase().split(/[ ,]+/).filter(Boolean).pop()?.replace(/[^a-z]/g,"");

function planImport(text){
  if (/^\s*\{/.test(text)){
    let data; try { data = JSON.parse(text); } catch { throw new Error("That backup file is damaged and couldn't be read."); }
    if (!Array.isArray(data.books)) throw new Error("That file isn't a Nightstand backup.");
    return { stage:"preview", kind:"Backup", backup:data, items:[], counts:{}, done:0, total:0, err:"" };
  }
  const rows = parseCSV(text);
  if (!rows.length) throw new Error("That file is empty.");
  const keys = Object.keys(rows[0]);
  const kind = keys.includes("exclusive shelf") ? "Goodreads" : keys.includes("read status") ? "StoryGraph" : null;
  if (!kind) throw new Error("That file doesn't look like a Goodreads or StoryGraph export. Make sure it's the .csv file the site gave you.");
  const books = rows.map(kind==="Goodreads" ? mapGoodreads : mapStoryGraph).filter(b=>b.title);
  const existing = new Map(S.books.filter(b=>!b.example).map(b=>[normKey(b.title,b.author), b]));
  const items = books.map(b => ({b, match: existing.get(normKey(b.title,b.author)) || null}));
  const by = s => items.filter(i=>i.b.status===s).length;
  return { stage:"preview", kind, items, counts:{finished:by("finished"), reading:by("reading"), tbr:by("tbr"), dnf:by("dnf")},
    includeTbr:true, dropSamples: S.books.some(b=>b.example), done:0, total:0, err:"" };
}
function mergeInto(base, inc){
  const out = {...base};
  for (const [k,v] of Object.entries(inc)){
    if (v===undefined || v===null || v==="" || (Array.isArray(v) && !v.length)) continue;
    if (["review","notes","contentWarnings","summary","genre"].includes(k) && base[k]) continue;
    if (k==="tags" && Array.isArray(base.tags)) { out.tags = [...new Set([...base.tags, ...v])]; continue; }
    out[k] = v;
  }
  return out;
}
async function runBackupRestore(){
  const P = S.imp, d = P.backup; P.stage="running"; P.err="";
  const books = d.books||[], chals = d.challenges||[], covers = d.covers||{};
  P.total = books.length + chals.length + Object.keys(covers).length; P.done=0; P.added=books.length; P.updated=0; renderModal();
  try {
    for (const [id, data] of Object.entries(covers)){ if (typeof data==="string" && S.assets?.restore) await S.assets.restore(id, data); P.done++; }
    for (const b of books){ const {id, ...rest} = b; if (rest.coverId && !covers[rest.coverId]) rest.coverId = null; await S.db.collection("books").doc(id).set(rest); P.done++; if (P.done%4===0) renderModal(); }
    for (const c of chals){ const {id, ...rest} = c; await S.db.collection("challenges").doc(id).set(rest); P.done++; }
    if (d.settings?.goals) await S.db.doc("settings/main").set({...S.settings, goals:{...(S.settings.goals||{}), ...d.settings.goals}});
    P.stage="done"; P.restored = {books:books.length, challenges:chals.length};
  } catch(e){ P.stage="done"; P.err = "The restore stopped partway through. Run it again with the same file; nothing will be duplicated."; }
  render();
}
async function runImport(){
  if (S.imp?.kind==="Backup") return runBackupRestore();
  const P = S.imp; P.stage="running"; P.err="";
  const items = P.items.filter(i => P.includeTbr || i.b.status!=="tbr");
  P.total = items.length + (P.dropSamples ? S.books.filter(b=>b.example).length : 0); P.done=0; P.added=0; P.updated=0; renderModal();
  const write = async (ref, data) => {
    try { await ref.set(data); }
    catch(e){ if (e?.code==="resource_exhausted" || e?.code==="resource-exhausted" || e?.code==="unavailable"){ await new Promise(r=>setTimeout(r,1500)); await ref.set(data); } else throw e; }
  };
  try {
    if (P.dropSamples) for (const b of S.books.filter(x=>x.example)){ await S.db.collection("books").doc(b.id).delete(); P.done++; }
    let n = 0;
    for (const {b, match} of items){
      if (match){
        const {id, ...rest} = match;
        await write(S.db.collection("books").doc(id), {...mergeInto(rest, b), importedFrom: P.kind});
        P.updated++;
      } else {
        const fresh = {...blank(), ...mergeInto(blank(), b), dateAdded: b.dateAdded || today(), importedFrom: P.kind, createdAt: Date.now() + (n++)};
        if (fresh.status==="finished" && fresh.pages && !fresh.currentPage) fresh.currentPage = fresh.pages;
        await write(S.db.collection("books").doc(), fresh);
        P.added++;
      }
      P.done++;
      if (P.done % 4 === 0 || P.done===P.total) renderModal();
    }
    P.stage="done";
  } catch(e){
    P.stage="done";
    P.err = e?.code==="quota_exceeded" ? "Your journal ran out of room partway through." : "The import stopped partway through. Run it again with the same file and it will pick up where it left off without making duplicates.";
  }
  // newest year with finished books becomes the selected year if the current one is empty
  if (!finishedIn(S.year).length){ const ys = yearsAvailable().filter(y=>finishedIn(y).length); if (ys.length) S.year = ys[0]; }
  render();
}

async function saveBook(id, data){

  await ref.set(data); return ref.id;
}
async function patch(id, fields){
  const b = S.books.find(x=>x.id===id); if(!b) return;
  const {id:_, ...rest} = b; S.busy=true;
  try { await saveBook(id, {...rest, ...fields}); }
  catch(e){ S.err = writeErr(e); }
  S.busy=false; render();

function writeErr(e){
  if (e?.code==="permission-denied") return "This Google account can't save to the journal. Check the email in your Firebase rules (setup guide, Part 2).";
  if (e?.code==="resource-exhausted") return "Firebase's free daily limit was reached. Your change will go through tomorrow.";
  if (e?.code==="too_large") return "That image is too large. Try a smaller photo.";
  return "That didn't save. Check your connection and try again.";
}
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 720/bmp.height);
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r => c.toBlob(r,"image/jpeg",.85));
}

async function sampleCover(e){
  const m = S.cm, img = e.target; if (!m || m.type !== "spine" || !m.pick) return;
  const b = S.books.find(x => x.id === m.id); if (!b) return;
  try {
    if (!m.corsImg) m.corsImg = await loadCors(coverSrcOf(b));
    const ci = m.corsImg, r = img.getBoundingClientRect();
    const px = Math.round((e.clientX - r.left) / r.width * ci.naturalWidth), py = Math.round((e.clientY - r.top) / r.height * ci.naturalHeight);
    const c = document.createElement("canvas"); c.width = 5; c.height = 5;
    const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(ci, px - 2, py - 2, 5, 5, 0, 0, 5, 5);
    const d = x.getImageData(0, 0, 5, 5).data; let rr=0, gg=0, bb=0, n=0;
    for (let i = 0; i < d.length; i += 4){ if (d[i+3] < 128) continue; rr += d[i]; gg += d[i+1]; bb += d[i+2]; n++; }
    if (!n) return;
    const hex = "#" + [rr, gg, bb].map(v => Math.round(v / n).toString(16).padStart(2, "0")).join("");
    const inp = $(m.pick === "color" ? "#sp-color" : "#sp-text"); if (!inp) return;
    inp.value = hex; inp.dispatchEvent(new Event("input", {bubbles:true}));
    toast(`${m.pick === "color" ? "Spine" : "Text"} color set to ${hex}`);
  } catch(_) {
    toast("This cover's image host doesn't allow picking colors from it. Use the color box's eyedropper instead.");
  }
}

    const assets = {
      async upload(blob){ const data = await toDataURL(blob); if (data.length > 900000) throw { code: "too_large" }; const r = doc(collection(fs, "users", uid, "covers")); await soft(setDoc(r, { data, createdAt: Date.now() })); return { id: r.id, url: data }; },
      delete: id => soft(deleteDoc(doc(fs, "users", uid, "covers", id))),
      restore: (id, data) => soft(setDoc(doc(fs, "users", uid, "covers", id), { data, createdAt: Date.now() }))
    };
    return { db, assets };
  };
  const authMsg = e => e?.code === "auth/unauthorized-domain" ? "Sign-in isn't allowed from this address yet. In Firebase, add it under Authentication → Settings → Authorized domains (setup guide, Part 4, step 5)."
    : e?.code === "auth/network-request-failed" ? "You're offline. Connect to the internet to sign in."
    : "Sign-in didn't finish. Try again.";
  window.NSAuth = {
    async signIn(){
      const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
      try { await signInWithPopup(auth, p); }
      catch (e) {
        if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") { try { await signInWithRedirect(auth, p); } catch (e2) { fail(authMsg(e2)); } }
        else if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") fail("");
        else fail(authMsg(e));
      }
    },
    async signOut(msg){ try { await signOut(auth); } catch {} fail(msg || ""); }
  };
  getRedirectResult(auth).catch(e => fail(authMsg(e)));
  onAuthStateChanged(auth, u => {
    if (u) window.NSApp.start({ ...makeCtx(u.uid), user: { email: u.email, name: u.displayName, photo: u.photoURL } });
    else if ($signinPending()) fail("");
  });
  function $signinPending(){ return !document.getElementById("signinBtn").disabled || document.getElementById("signinBtn").hidden; }
}
</script>
</body>
