<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d5b44" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1813" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ashlin's reading journal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<title>Nightstand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500&family=Bebas+Neue&family=Cinzel:wght@500&family=Playfair+Display:wght@500&family=Special+Elite&display=swap">
<style>
/* Layout: a library study — header + tabs; dashboard = goal ring & tiles, a wooden bookshelf of the year's finished books, then charts; library = cover wall */
:root{
  --bg:#eceee5; --surface:#f7f8f2; --sunk:#e2e6da; --ink:#1c2a22; --muted:#5a6a5f; --line:#d0d7c9;
  --accent:#2d5b44; --accent-ink:#f4f6ef; --brass:#a57724; --rust:#a4472f;
  --wood1:#7b502f; --wood2:#5b3a20; --shelf-back:#dfe4d6;
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-body:"Karla", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Bradley Hand", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1813; --surface:#15231c; --sunk:#0b140f; --ink:#e5ebdd; --muted:#98a99c; --line:#283a30;
  --accent:#86bb99; --accent-ink:#0e1813; --brass:#d6aa55; --rust:#d77f62;
  --wood1:#6a4327; --wood2:#452a16; --shelf-back:#0a120e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1813; --surface:#15231c; --sunk:#0b140f; --ink:#e5ebdd; --muted:#98a99c; --line:#283a30;
  --accent:#86bb99; --accent-ink:#0e1813; --brass:#d6aa55; --rust:#d77f62;
  --wood1:#6a4327; --wood2:#452a16; --shelf-back:#0a120e; color-scheme:dark }

*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(28px,4.5vw,40px);line-height:1.05}
h2{font-size:21px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:18px}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rust);border-color:color-mix(in srgb,var(--rust) 45%,transparent);background:transparent}
.btn.danger.armed{background:var(--rust);color:var(--surface);border-color:var(--rust)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;cursor:pointer}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}

.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--brass) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);padding:10px 14px;border-radius:var(--r);margin-bottom:18px;font-size:14px}

/* dashboard */
.dash{display:grid;gap:18px}
.row1{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:18px}
@media (max-width:820px){.row1{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring text{fill:var(--ink)}
.goal .big{font-family:var(--f-display);font-size:34px;line-height:1}
.goal .pace{color:var(--muted);font-size:13.5px;margin-top:6px}
.goal-edit{display:flex;gap:6px;align-items:center;margin-top:10px}
.goal-edit input{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.tile .v small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.tile .stars{color:var(--brass);letter-spacing:1px;font-size:14px}

.row2{display:grid;grid-template-columns:1fr minmax(260px,340px);gap:18px}
@media (max-width:920px){.row2{grid-template-columns:1fr}}
.shelf{display:flex;flex-wrap:wrap;align-content:flex-start;gap:0;padding:10px 14px 0;border-radius:8px;min-height:170px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 136px, var(--wood1) 136px 146px, var(--wood2) 146px 152px),
    var(--shelf-back);
  box-shadow:inset 0 0 0 1px var(--line)}
.slot{height:152px;display:flex;align-items:flex-end;padding-bottom:16px}
.spine{width:var(--w);height:var(--ht);border:0;border-radius:2px 2px 1px 1px;cursor:pointer;position:relative;padding:8px 0;
  background:linear-gradient(90deg,hsl(var(--h) 36% 20%),hsl(var(--h) 38% 33%) 28%,hsl(var(--h) 36% 27%) 70%,hsl(var(--h) 36% 19%));
  color:hsl(var(--h) 30% 92%);writing-mode:vertical-rl;font-family:var(--f-display);font-size:var(--fs,10.5px);line-height:1.08;overflow:hidden;white-space:normal;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.22),inset 1px 0 0 rgba(255,255,255,.08),-3px 0 4px -2px rgba(0,0,0,.45);transition:transform .15s ease}
.spine::before,.spine::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:hsl(var(--h) 40% 70% / .55)}
.spine.ff-sans{font-family:"Karla",system-ui,sans-serif;font-weight:700}
.spine.ff-tall{font-family:"Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.03em}
.spine.ff-elegant{font-family:"Playfair Display",Georgia,serif}
.spine.ff-roman{font-family:"Cinzel",Georgia,serif}
.spine.ff-type{font-family:"Special Elite","Courier New",monospace}
.spine.ff-hand{font-family:"Caveat",cursive}
.spine-edit{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
@media (max-width:600px){.spine-edit{grid-template-columns:1fr}}
.shelf.preview{justify-content:center;min-height:152px;padding:0 14px}
.spine-stage p{text-align:center;margin:8px 0 0}
.spine-controls{display:flex;flex-direction:column;gap:14px}
.sc-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.sc-row>label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sc-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.sc-ctl input[type=color]{width:44px;height:32px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.sc-ctl input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--accent)}
.sc-ctl select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
.sc-val{font-size:13px;min-width:44px;font-variant-numeric:tabular-nums}
.sc-tag{font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.sc-hint{font-size:12.5px;color:var(--muted);grid-column:2}
.spine::before{top:6px}.spine::after{bottom:6px}
.spine span{display:block;max-height:100%;max-width:100%;overflow:hidden;overflow-wrap:anywhere;text-align:center;padding-block:7px;margin:0 auto}
.spine.cc{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 68%,#000),var(--c) 28%,color-mix(in srgb,var(--c) 90%,#000) 70%,color-mix(in srgb,var(--c) 62%,#000));color:var(--ct)}
.spine.cc::before,.spine.cc::after{background:color-mix(in srgb,var(--ct) 50%,transparent)}
.spine:hover,.spine:focus-visible{transform:translateY(-6px)}
.shelf.arranging .slot[data-id]{touch-action:none;cursor:grab}
.shelf.arranging .spine{cursor:grab;outline:1px dashed color-mix(in srgb,var(--brass) 70%,transparent);outline-offset:2px}
.shelf.arranging .spine:hover{transform:none}
.shelf .slot.dragging{opacity:.55}
.shelf .slot.dragging .spine{transform:translateY(-10px)}
.arrange-hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.spine-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.spine-ctl input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.plant{width:46px;height:auto;display:block}
.shelf-empty{display:flex;align-items:center;justify-content:center;width:100%;height:136px;color:var(--muted);font-style:italic;text-align:center;padding:0 20px}

.reading-list{display:flex;flex-direction:column;gap:14px}
.reading-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.reading-item .t{font-weight:700;line-height:1.25}
.reading-item .a{color:var(--muted);font-size:13px}
.fmt{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid currentColor}
.fmt svg{width:14px;height:14px;flex:none}
.fmt-print{color:var(--accent)} .fmt-ebook{color:var(--brass)} .fmt-audiobook{color:var(--rust)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:99px}
.mini{font-size:12.5px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);font-size:14px}

.row3{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:820px){.row3{grid-template-columns:1fr}}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .b.now{fill:var(--brass)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(80px,120px) 1fr 26px;gap:10px;align-items:center;font-size:13.5px}
.hb .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .trk{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hb .trk i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .n{text-align:right;font-weight:700}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 8px;background:var(--sunk)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.upnext{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.upnext .cover-btn{flex:0 0 74px}

/* covers */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;
  background:hsl(var(--h) 34% 30%);color:hsl(var(--h) 35% 94%);box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 14px -8px rgba(0,0,0,.45);
  display:flex;flex-direction:column;padding:12% 10% 9%;text-align:center}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.06))}
.cover .band{height:2px;background:hsl(var(--h) 45% 72%);opacity:.8;margin:0 8%}
.cover .ct{font-family:var(--f-display);font-size:var(--cs,15px);line-height:1.12;margin:auto 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;text-wrap:balance}
.cover .ca{font-size:calc(var(--cs,15px)*.62);letter-spacing:.1em;text-transform:uppercase;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.sm{--cs:9px;padding:10% 8%}
.cover.sm .ca{display:none}
.cover-btn{background:none;border:0;padding:0;cursor:pointer;display:block;width:100%}

/* library */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
@media (max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card .t{font-weight:700;line-height:1.25;font-size:14.5px}
.card .a{color:var(--muted);font-size:13px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stars{color:var(--brass);letter-spacing:1px;font-size:13px;white-space:nowrap}
.status{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-reading{color:var(--brass)} .s-finished{color:var(--accent)} .s-tbr{color:var(--muted)} .s-dnf{color:var(--rust)}
.lib-count{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.lib-empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:820px;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.sheet-b{padding:20px 18px 22px}
.detail{display:grid;grid-template-columns:200px 1fr;gap:24px}
@media (max-width:640px){.detail{grid-template-columns:1fr}.detail .dcover{max-width:170px;margin:0 auto}}
.detail h2{font-size:28px;line-height:1.1}
.detail .by{color:var(--muted);margin:4px 0 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 18px;margin:16px 0;padding:14px 0;border-block:1px solid var(--line)}
.facts div{display:flex;flex-direction:column;font-size:14px;min-width:0}
.facts span:first-child{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prog-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.prog-row input{width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.review{white-space:pre-wrap;margin:6px 0 0}
.quote{font-family:var(--f-hand);font-size:22px;line-height:1.25;color:var(--accent);margin:6px 0 0;white-space:pre-wrap}
.block{margin-top:18px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap}

/* form */
form .fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:560px){form .fg{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.cover-pick{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start;grid-column:1/-1}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:hsl(var(--h) 34% 32%)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--rust);font-size:13.5px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30}
/* import, summary, moods */
.imp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0}
@media (max-width:600px){.imp-cols{grid-template-columns:1fr}}
.imp-src{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--bg)}
.imp-src h3{font-size:18px;margin-bottom:6px}
.imp-src ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.imp-src p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:16px 0}
.imp-stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}
.imp-stats b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:8px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.summary-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:6px}
.summary-box p{margin:0;white-space:pre-wrap}
.byline{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.community{font-size:13px;color:var(--muted);margin-top:4px}
.community b{color:var(--ink)}

<body>


<div id="signin" class="signin">
  <div class="signin-card">
    <img src="icon-192.png" alt="" width="88" height="88" class="signin-icon">
    <h1>Nightstand</h1>
    <p class="sub">Your reading journal, on every device.</p>
    <button class="btn primary" id="signinBtn" data-act="signin" hidden>Sign in with Google</button>
    <p id="signinMsg" class="mini" role="status">Opening your journal…</p>
  </div>
</div>
<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Ashlin's</div>
      <h1>Nightstand</h1>
      <div class="sub" id="subline">Every book, page and rating in one place. <span class="offline" id="offline" hidden>Offline · changes will sync</span></div>
    </div>
    <div class="actions">
      <label class="eyebrow" for="yearSel" style="margin-right:-4px">Year</label>
      <select class="pill" id="yearSel" aria-label="Year"></select>
      <button class="btn" data-act="import" id="importBtn">Import</button>
      <button class="btn primary" data-act="new" id="addBtn">+ Add a book</button>
      <button class="avatar" data-act="account" id="acctBtn" aria-label="Account and backups">?</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-dash" data-act="tab" data-tab="dash" aria-selected="true">Dashboard</button>
    <button class="tab" role="tab" id="tab-lib" data-act="tab" data-tab="lib" aria-selected="false">Library</button>
    <button class="tab" role="tab" id="tab-chal" data-act="tab" data-tab="chal" aria-selected="false">Challenges</button>
  </nav>
  <div id="notice"></div>
  <main id="view"></main>
</div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STATUS = {reading:"Reading", tbr:"Want to read", finished:"Finished", dnf:"Did not finish"};
const FORMATS = ["Print","Ebook","Audiobook"];
const SOURCES = ["Bought","Library","Gift","Borrowed","Kindle Unlimited","Other"];
const GENRES = ["Literary fiction","Historical fiction","Romance","Fantasy","Science fiction","Mystery / thriller","Contemporary","Memoir","Nonfiction","Education","Children's / YA","Poetry"];
const HUES = [150,95,40,15,355,320,265,220,195,28];
const today = () => new Date().toLocaleDateString("en-CA");
const thisYear = new Date().getFullYear();

const S = { tab:"dash", year:thisYear, books:[], settings:{goals:{}}, loaded:false, db:null, assets:null, canWrite:true, noDb:false,
  q:"", fStatus:"all", fGenre:"", sort:"added", openId:null, editing:false, draft:null, editingGoal:false, armedDelete:false, busy:false, err:"",
  sample:null, imp:null, sum:null, challenges:[], cm:null, pendingSlot:null, fChal:"", coverMap:{}, user:null, unsubs:[], ol:null };
const PACES = ["slow","medium","fast"];
let shelfDrag = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };
const hueOf = b => (b.hue ?? HUES[hash(b.title||"") % HUES.length]);
const yr = d => d ? Number(String(d).slice(0,4)) : null;
const fmtDate = d => { if(!d) return "—"; const [y,m,dd]=d.split("-").map(Number); return `${MONTHS[m-1]} ${dd}, ${y}`; };
const stars = r => { r = Number(r)||0; if(!r) return ""; const f=Math.floor(r); return "★".repeat(f) + (r-f>=.5?"½":""); };
const money = n => "$" + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

/* ---------- covers & spines ---------- */
function cover(b, cls=""){
  const h = hueOf(b);
  const src = (b.coverId && S.coverMap[b.coverId]) || (b.olCover ? `https://covers.openlibrary.org/b/id/${encodeURIComponent(b.olCover)}-M.jpg` : "") || b.coverUrl || "";
  const img = src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="cover ${cls}" style="--h:${h}"><div class="band"></div><div class="ct">${esc(b.title||"Untitled")}</div><div class="ca">${esc(b.author||"")}</div>${img}</div>`;
}
function coverSrcOf(b){ return (b.coverId && S.coverMap[b.coverId]) || (b.olCover ? `https://covers.openlibrary.org/b/id/${encodeURIComponent(b.olCover)}-M.jpg` : "") || b.coverUrl || ""; }
const SPINE_FONTS = {
  serif:   {label:"Classic serif", adv:.6,  boost:0},
  sans:    {label:"Clean sans",    adv:.56, boost:0},
  tall:    {label:"Tall caps",     adv:.42, boost:2},
  elegant: {label:"Elegant serif", adv:.6,  boost:0},
  roman:   {label:"Engraved caps", adv:.74, boost:-.5},
  type:    {label:"Typewriter",    adv:.64, boost:0},
  hand:    {label:"Handwritten",   adv:.44, boost:3}
};
// Auto width follows the page count: thin for short books, chunky for long ones
// Square-root scale: a big book is still visibly thicker, but doubling the pages doesn't double the width
function autoWidth(b){ const pages = Number(b.pages) || 300; return Math.round(Math.max(14, Math.min(42, 4 + 1.3 * Math.sqrt(pages)))); }
function autoHeight(b){ return 106 + (hash(String(b.title||"")) % 20); }
function spineLayout(b){
  const title = String(b.title || "Untitled");
  const fk = SPINE_FONTS[b.spineFont] ? b.spineFont : "serif", font = SPINE_FONTS[fk];
  const ht = Number(b.spineH) || autoHeight(b);
  const len = ht - 24;
  const need = fs => { const per = Math.max(4, Math.floor(len / (fs * font.adv))); const cols = Math.ceil(title.length / per); return {cols, w: cols * fs * 1.12 + 9}; };
  let fs = (title.length > 44 ? 9.5 : 10.5) + font.boost, w;
  if (Number(b.spineW)) { w = Number(b.spineW); while (fs > 7 && need(fs).w > w) fs -= .5; }
  else {
    const w0 = autoWidth(b);
    while (fs > 8.5 && need(fs).w > w0) fs -= .5;          // shrink the lettering a little before widening
    while (fs > 7.5 && need(fs).w > 42) fs -= .5;
    w = Math.min(42, Math.max(w0, Math.round(need(fs).w)));
  }
  return {title, fk, ht, fs, w};
}
function spine(b, i){
  const L = spineLayout(b);
  const bg = spineHexOf(b), tc = b.spineTextColor || textOn(bg);
  return `<div class="slot" data-id="${esc(b.id)}"><button class="spine cc ff-${L.fk}" style="--h:${hueOf(b)};--w:${L.w}px;--ht:${L.ht}px;--fs:${L.fs}px;--c:${bg};--ct:${tc}" data-act="${S.arranging?"noop":"open"}" data-id="${esc(b.id)}" title="${esc(L.title)}${b.author?" by "+esc(b.author):""}"><span>${esc(L.title)}</span></button></div>`;
}
function textOn(hex){ const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), bb=parseInt(hex.slice(5,7),16); return (0.2126*r+0.7152*g+0.0722*bb)/255 > .58 ? "#1c1c1c" : "#fbf7ee"; }
function hslHex(h, s, l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join(""); }
function spineHexOf(b){ const src = coverSrcOf(b); if (b.spineColor && (b.spineManual || b.spineFor === srcKey(src))) return b.spineColor; return hslHex(hueOf(b), 37, 29); }
const PLANT = `<div class="slot" aria-hidden="true"><svg class="plant" viewBox="0 0 46 70"><path d="M23 44 C10 40 4 30 6 18 C14 22 20 30 23 44Z" fill="#4f8a5f"/><path d="M23 44 C34 38 42 28 40 14 C31 20 25 30 23 44Z" fill="#3f7550"/><path d="M23 44 C20 30 22 16 28 6 C31 18 28 32 23 44Z" fill="#5f9c6c"/><path d="M11 44 H35 L32 68 H14 Z" fill="#b8693f"/><rect x="9" y="42" width="28" height="6" rx="2" fill="#c97a4c"/></svg></div>`;

/* ---------- derived data ---------- */
function yearsAvailable(){
  const ys = new Set([thisYear]);
  S.books.forEach(b => { [b.finishDate,b.startDate,b.dateAdded].forEach(d => { const y=yr(d); if(y) ys.add(y); }); });
  return [...ys].sort((a,b)=>b-a);
}
function finishedIn(y){ return S.books.filter(b => b.status==="finished" && yr(b.finishDate)===y).sort((a,b)=> (a.finishDate||"").localeCompare(b.finishDate||"")); }

/* ---------- spine editor ---------- */
function spineDraftFor(b){
  const color = spineHexOf(b);
  return { colorManual: !!b.spineManual, color, textManual: !!b.spineTextColor, textColor: b.spineTextColor || textOn(color),
    font: SPINE_FONTS[b.spineFont] ? b.spineFont : "serif", height: Number(b.spineH) || null, width: Number(b.spineW) || null };
}
function spineMerged(b, d){
  const autoColor = !d.colorManual && b.spineManual ? "" : b.spineColor;
  return {...b, spineManual: d.colorManual, spineColor: d.colorManual ? d.color : autoColor, spineTextColor: d.textManual ? d.textColor : "",
    spineFont: d.font, spineH: d.height, spineW: d.width};
}
function spineEditHTML(){
  const m = S.cm, b = S.books.find(x => x.id === m.id); if (!b) return "";
  const d = m.d, mb = spineMerged(b, d), L = spineLayout(mb);
  const pages = Number(b.pages);
  const auto = (on, act) => on ? `<button type="button" class="linkish" data-act="${act}">Auto</button>` : `<span class="sc-tag">Auto</span>`;
  return `<div class="sheet-h"><div style="min-width:0"><div class="eyebrow">Edit spine</div><h2 style="margin-top:2px">${esc(b.title)}</h2></div><button class="x" data-act="close-spine" aria-label="Close">×</button></div>
  <div class="sheet-b"><div class="spine-edit">
    <div class="spine-stage"><div class="shelf preview" id="spinePreview">${spine(mb)}</div><p class="mini">Preview at shelf size</p></div>
    <form id="spineForm" class="spine-controls" autocomplete="off">
      <div class="sc-row"><label for="sp-color">Spine color</label><div class="sc-ctl"><input type="color" id="sp-color" value="${esc(spineHexOf(mb))}">${d.colorManual?`<button type="button" class="linkish" data-act="sp-color-auto">Match cover</button>`:`<span class="sc-tag">Matches cover</span>`}</div></div>
      <div class="sc-row"><label for="sp-text">Text color</label><div class="sc-ctl"><input type="color" id="sp-text" value="${esc(d.textManual ? d.textColor : textOn(spineHexOf(mb)))}">${auto(d.textManual, "sp-text-auto")}</div></div>
      <div class="sc-row"><label for="sp-font">Font</label><div class="sc-ctl"><select id="sp-font">${Object.entries(SPINE_FONTS).map(([k,f])=>`<option value="${k}" ${k===d.font?"selected":""}>${f.label}</option>`).join("")}</select></div></div>
      <div class="sc-row"><label for="sp-h">Height</label><div class="sc-ctl"><input type="range" id="sp-h" min="80" max="136" step="1" value="${L.ht}"><span class="sc-val" id="sp-h-val">${L.ht}px</span>${auto(!!d.height, "sp-h-auto")}</div></div>
      <div class="sc-row"><label for="sp-w">Width</label><div class="sc-ctl"><input type="range" id="sp-w" min="12" max="80" step="1" value="${L.w}"><span class="sc-val" id="sp-w-val">${L.w}px</span>${auto(!!d.width, "sp-w-auto")}</div>
        <div class="sc-hint">${d.width ? "Set by hand." : pages ? `Auto width follows the page count (${pages} pages).` : "Add a page count to the book and auto width will follow it."}</div></div>
    </form>
  </div>
  <div class="foot"><button class="btn ghost" data-act="sp-reset">Reset to automatic</button><div class="grp"><button class="btn ghost" data-act="close-spine">Cancel</button><button class="btn primary" data-act="sp-save">Save spine</button></div></div></div>`;
}
function refreshSpinePreview(){
  const m = S.cm; if (!m || m.type !== "spine") return;
  const b = S.books.find(x => x.id === m.id); if (!b) return;
  const mb = spineMerged(b, m.d), L = spineLayout(mb);
  const pv = $("#spinePreview"); if (pv) pv.innerHTML = spine(mb);
  const hv = $("#sp-h-val"), wv = $("#sp-w-val"), hr = $("#sp-h"), wr = $("#sp-w");
  if (hv) hv.textContent = L.ht + "px"; if (wv) wv.textContent = L.w + "px";
  if (hr && !m.d.height) hr.value = L.ht; if (wr && !m.d.width) wr.value = L.w;

const SRC_ORDER = {"Hardcover":0, "Google Books":1, "Open Library":2};
const olCoverUrl = id => `https://covers.openlibrary.org/b/id/${encodeURIComponent(id)}-M.jpg?default=false`;
async function findCovers(q){
  const out = [], seen = new Set();
  const add = (url, src, label, color) => { if (!url) return; const k = url.replace(/[?&]default=false/,""); if (seen.has(k)) return; seen.add(k); out.push({url, src, label: label||"", color: color||""}); };
  const jobs = [];
  if (hcProxy()) jobs.push(hcSearch(q, null, 8).then(r => r.forEach(d => add(d.cover_url, "Hardcover", d.title, d._color))).catch(()=>{}));
  jobs.push(gbSearch(q, null, 20).then(r => r.forEach(d => add(d.cover_url, "Google Books", d.title))).catch(()=>{}));
  jobs.push((async () => {
    const j = await getJSON(`${OL}/search.json?q=${encodeURIComponent(q)}&fields=key,title,cover_i&limit=5`);
    const docs = j.docs || [];
    docs.forEach(d => { if (d.cover_i) add(olCoverUrl(d.cover_i), "Open Library", d.title); });
    if (docs[0]?.key){
      const e = await getJSON(`${OL}${docs[0].key}/editions.json?limit=60`);
      (e.entries || []).forEach(ed => (ed.covers || []).filter(c => c > 0).forEach(c => add(olCoverUrl(c), "Open Library", ed.title)));
    }
  })().catch(()=>{}));
  await Promise.all(jobs);
  return out.sort((a,b) => SRC_ORDER[a.src] - SRC_ORDER[b.src]).slice(0, 60);
}

/* ---------- spine colors from covers ---------- */
// Short, stable key for a cover source (uploaded photos are long data URLs)
function srcKey(src){ return !src ? "" : src.startsWith("data:") ? "photo:" + hash(src) : src; }
function dominantColor(img){
  const W = 24, H = 36, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data; // throws if the image host doesn't allow reading
  const buckets = new Map();
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 200) continue;
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    const sat = mx ? (mx - mn) / mx : 0;
    // favor colorful pixels a little over plain white/black areas
    const weight = 1 + sat * 1.5 - (mx > 240 && sat < .08 ? .6 : 0) - (mx < 25 ? .4 : 0);
    const k = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5);
    const e = buckets.get(k) || {w:0, r:0, g:0, b:0};
    e.w += weight; e.r += r*weight; e.g += g*weight; e.b += b*weight; buckets.set(k, e);
  }
  let best = null; for (const e of buckets.values()) if (!best || e.w > best.w) best = e;
  if (!best || best.w <= 0) return null;
  let r = best.r/best.w, g = best.g/best.w, b = best.b/best.w;

  const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  if (lum > .82){ r *= .86; g *= .86; b *= .86; }

}
function loadCors(src){
  return new Promise((res, rej) => {
    const img = new Image(); if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
    const t = setTimeout(() => rej(new Error("slow")), 12000);

const spineQueue = new Set(); let spineBusy = false;
function queueSpineColors(books){
  if (!S.canWrite || !S.db) return;
  books.forEach(b => { if (b.spineManual) return; const k = srcKey(coverSrcOf(b)); if (k && b.spineFor !== k && !S.spineTried?.[b.id + k]) spineQueue.add(b.id); });

}
async function runSpineQueue(){
  spineBusy = true; S.spineTried = S.spineTried || {};

    const id = spineQueue.values().next().value; spineQueue.delete(id);
    const b = S.books.find(x => x.id === id); if (!b || b.spineManual) continue;
    const src = coverSrcOf(b), k = srcKey(src); if (!k || b.spineFor === k) continue;
    S.spineTried[id + k] = true;

    try { out = dominantColor(await loadCors(src)); } catch(_) { out = null; }
    if (!out && !navigator.onLine) continue;
    // remember the attempt either way, so a cover that can't be read isn't retried on every device
    const {id:_i, ...rest} = b;
    try { await saveBook(id, {...rest, spineColor: out ? out.color : "", spineText: out ? out.text : "", spineFor: k}); } catch(_) {}
    await new Promise(r => setTimeout(r, 150));
  }

  const o = {...rest, moods, series:(d.series||"").trim(), communityRating:n(d.communityRating), pace:d.pace||"", summary:(d.summary||"").trim(),
    title:d.title.trim(),author:(d.author||"").trim(),genre:(d.genre||"").trim(),format:d.format||"Print",status:d.status||"tbr",
    rating:n(d.rating),pages:n(d.pages),currentPage:n(d.currentPage),startDate:d.startDate||"",finishDate:d.finishDate||"",source:d.source||"",
    cost:n(d.cost),review:d.review||"",notes:d.notes||"",quote:d.quote||"",dateAdded:d.dateAdded||today(),hue:d.hue??null,coverId:d.coverId||null,
    createdAt:d.createdAt||Date.now()};
  if (o.summary !== (S.books.find(b=>b.id===_id)?.summary||"")) o.summaryBy = !o.summary ? "" : (o.summary === (d._autoSummary||"").trim() ? d.summaryBy : "me");

// fetch JSON with a time limit; failures carry a short reason we can show
async function getJSON(url, signal, ms=15000){
  const ctl = new AbortController(); let timedOut = false;
  const t = setTimeout(() => { timedOut = true; ctl.abort(); }, ms);
  if (signal){ if (signal.aborted) ctl.abort(); else signal.addEventListener("abort", () => ctl.abort(), {once:true}); }
  let r;
  try { r = await fetch(url, {signal: ctl.signal}); }
  catch(_){
    clearTimeout(t);
    if (signal?.aborted && !timedOut) { const a = new Error("cancel"); a.name = "AbortError"; throw a; }
    const e = new Error("fetch failed"); e.reason = timedOut ? "took too long" : "blocked or unreachable"; throw e;
  }
  clearTimeout(t);
  if (!r.ok) { const e = new Error("status " + r.status); e.status = r.status; e.reason = r.status === 429 ? "too many requests" : `error ${r.status}`; throw e; }
  try { return await r.json(); } catch(_) { const e = new Error("bad json"); e.reason = "sent something unreadable"; throw e; }
}

function olPatch(d, work, base, overwrite){

async function runBulkOL(){

    if (S.cm !== me) return;
    try {
      const cur = S.books.find(x => x.id === b.id) || b; const {id, ...rest} = cur;
      const upgrade = !!cur.olKey; // already matched elsewhere: only ask Hardcover
      const d = upgrade ? await hcFind(String(cur.title).replace(/\(.*?\)/g,"").split(":")[0].trim(), cur.author) : await olSearchBook(cur.title, cur.author);
      if (d){
        const work = (!cur.summary || !cur.genre) ? await olWork(d.key) : null;
        const p = olPatch(d, work, cur, false);
        if (upgrade && d.cover_url && !cur.coverId){ p.coverUrl = d.cover_url; p.olCover = ""; }
        await saveBook(id, {...rest, ...p}); me.found++;

}

/* ---------- import (Goodreads / StoryGraph CSV) ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const hdr = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(x=>x.trim())).map(r => Object.fromEntries(hdr.map((h,i)=>[h,(r[i]??"").trim()])));
}
const toDate = v => { const m = String(v||"").trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : ""; };
const stripHtml = h => { if(!h) return ""; const doc = new DOMParser().parseFromString(String(h).replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n\n"), "text/html"); return (doc.body.textContent||"").replace(/\n{3,}/g,"\n\n").trim(); };
const num = v => { const n = Number(String(v||"").replace(/[^\d.]/g,"")); return n>0 ? n : ""; };
const fmtOf = v => /audio|audible/i.test(v) ? "Audiobook" : /kindle|ebook|e-book|nook|digital/i.test(v) ? "Ebook" : "Print";
function splitSeries(t){ const m = String(t).match(/^(.*?)\s*\(([^()]*#\s*[\d.]+[^()]*)\)\s*$/); return m ? [m[1].trim(), m[2].trim()] : [String(t).trim(), ""]; }

function mapGoodreads(r){
  const [title, series] = splitSeries(r["title"]);
  const shelf = (r["exclusive shelf"]||"").toLowerCase();
  const status = {read:"finished","currently-reading":"reading","to-read":"tbr"}[shelf] || (/dnf|did-not-finish|abandon/.test(shelf) ? "dnf" : "tbr");

function mapStoryGraph(r){

const normKey = (t,a) => String(t||"").toLowerCase().replace(/\(.*?\)/g,"").split(":")[0].replace(/[^a-z0-9]/g,"") + "|" + String(a||"").toLowerCase().split(/[ ,]+/).filter(Boolean).pop()?.replace(/[^a-z]/g,"");

function planImport(text){
  if (/^\s*\{/.test(text)){
    let data; try { data = JSON.parse(text); } catch { throw new Error("That backup file is damaged and couldn't be read."); }
    if (!Array.isArray(data.books)) throw new Error("That file isn't a Nightstand backup.");
    return { stage:"preview", kind:"Backup", backup:data, items:[], counts:{}, done:0, total:0, err:"" };
  }
  const rows = parseCSV(text);
  if (!rows.length) throw new Error("That file is empty.");
  const keys = Object.keys(rows[0]);
  const kind = keys.includes("exclusive shelf") ? "Goodreads" : keys.includes("read status") ? "StoryGraph" : null;
  if (!kind) throw new Error("That file doesn't look like a Goodreads or StoryGraph export. Make sure it's the .csv file the site gave you.");
  const books = rows.map(kind==="Goodreads" ? mapGoodreads : mapStoryGraph).filter(b=>b.title);
  const existing = new Map(S.books.filter(b=>!b.example).map(b=>[normKey(b.title,b.author), b]));
  const items = books.map(b => ({b, match: existing.get(normKey(b.title,b.author)) || null}));
  const by = s => items.filter(i=>i.b.status===s).length;
  return { stage:"preview", kind, items, counts:{finished:by("finished"), reading:by("reading"), tbr:by("tbr"), dnf:by("dnf")},
    includeTbr:true, dropSamples: S.books.some(b=>b.example), done:0, total:0, err:"" };
}
function mergeInto(base, inc){
  const out = {...base};
  for (const [k,v] of Object.entries(inc)){
    if (v===undefined || v===null || v==="" || (Array.isArray(v) && !v.length)) continue;
    if (["review","notes","contentWarnings","summary","genre"].includes(k) && base[k]) continue;
    if (k==="tags" && Array.isArray(base.tags)) { out.tags = [...new Set([...base.tags, ...v])]; continue; }
    out[k] = v;
  }
  return out;
}
async function runBackupRestore(){
  const P = S.imp, d = P.backup; P.stage="running"; P.err="";
  const books = d.books||[], chals = d.challenges||[], covers = d.covers||{};
  P.total = books.length + chals.length + Object.keys(covers).length; P.done=0; P.added=books.length; P.updated=0; renderModal();
  try {
    for (const [id, data] of Object.entries(covers)){ if (typeof data==="string" && S.assets?.restore) await S.assets.restore(id, data); P.done++; }
    for (const b of books){ const {id, ...rest} = b; if (rest.coverId && !covers[rest.coverId]) rest.coverId = null; await S.db.collection("books").doc(id).set(rest); P.done++; if (P.done%4===0) renderModal(); }
    for (const c of chals){ const {id, ...rest} = c; await S.db.collection("challenges").doc(id).set(rest); P.done++; }
    if (d.settings?.goals) await S.db.doc("settings/main").set({...S.settings, goals:{...(S.settings.goals||{}), ...d.settings.goals}});
    P.stage="done"; P.restored = {books:books.length, challenges:chals.length};
  } catch(e){ P.stage="done"; P.err = "The restore stopped partway through. Run it again with the same file; nothing will be duplicated."; }
  render();
}
async function runImport(){
  if (S.imp?.kind==="Backup") return runBackupRestore();
  const P = S.imp; P.stage="running"; P.err="";
  const items = P.items.filter(i => P.includeTbr || i.b.status!=="tbr");
  P.total = items.length + (P.dropSamples ? S.books.filter(b=>b.example).length : 0); P.done=0; P.added=0; P.updated=0; renderModal();
  const write = async (ref, data) => {
    try { await ref.set(data); }
    catch(e){ if (e?.code==="resource_exhausted" || e?.code==="resource-exhausted" || e?.code==="unavailable"){ await new Promise(r=>setTimeout(r,1500)); await ref.set(data); } else throw e; }
  };
  try {
    if (P.dropSamples) for (const b of S.books.filter(x=>x.example)){ await S.db.collection("books").doc(b.id).delete(); P.done++; }
    let n = 0;
    for (const {b, match} of items){
      if (match){
        const {id, ...rest} = match;
        await write(S.db.collection("books").doc(id), {...mergeInto(rest, b), importedFrom: P.kind});
        P.updated++;
      } else {
        const fresh = {...blank(), ...mergeInto(blank(), b), dateAdded: b.dateAdded || today(), importedFrom: P.kind, createdAt: Date.now() + (n++)};
        if (fresh.status==="finished" && fresh.pages && !fresh.currentPage) fresh.currentPage = fresh.pages;
        await write(S.db.collection("books").doc(), fresh);
        P.added++;
      }
      P.done++;
      if (P.done % 4 === 0 || P.done===P.total) renderModal();
    }
    P.stage="done";
  } catch(e){
    P.stage="done";
    P.err = e?.code==="quota_exceeded" ? "Your journal ran out of room partway through." : "The import stopped partway through. Run it again with the same file and it will pick up where it left off without making duplicates.";
  }
  // newest year with finished books becomes the selected year if the current one is empty
  if (!finishedIn(S.year).length){ const ys = yearsAvailable().filter(y=>finishedIn(y).length); if (ys.length) S.year = ys[0]; }
  render();
}

async function saveBook(id, data){
  const ref = id ? S.db.collection("books").doc(id) : S.db.collection("books").doc();
  await ref.set(data); return ref.id;
}
async function patch(id, fields){
  const b = S.books.find(x=>x.id===id); if(!b) return;
  const {id:_, ...rest} = b; S.busy=true;
  try { await saveBook(id, {...rest, ...fields}); }
  catch(e){ S.err = writeErr(e); }
  S.busy=false; render();
}
function writeErr(e){
  if (e?.code==="permission-denied") return "This Google account can't save to the journal. Check the email in your Firebase rules (setup guide, Part 2).";
  if (e?.code==="resource-exhausted") return "Firebase's free daily limit was reached. Your change will go through tomorrow.";
  if (e?.code==="too_large") return "That image is too large. Try a smaller photo.";
  return "That didn't save. Check your connection and try again.";
}
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 720/bmp.height);
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r => c.toBlob(r,"image/jpeg",.85));
}

  if (act==="signin"){ el.disabled=true; $("#signinMsg").textContent="Opening Google sign-in…"; window.NSAuth?.signIn(); return; }
  if (act==="signout"){ S.cm=null; renderModal(); window.NSAuth?.signOut(); return; }
  if (act==="account"){ S.openId=null; S.cm={type:"account"}; renderModal(); return; }
  if (act==="backup"){ downloadBackup(); return; }
  if (act==="bulk-ol"){ S.openId=null; S.imp=null; runBulkOL(); return; }
  if (act==="ol-pick"){ pickOl(Number(el.dataset.i)); return; }
  if (act==="spine-edit"){ const b=S.books.find(x=>x.id===S.openId); if(!b) return; S.cm={type:"spine", id:b.id, d:spineDraftFor(b)}; renderModal(); return; }
  if (act==="close-spine"){ const id=S.cm?.id; S.cm=null; S.openId=id||null; renderModal(); return; }
  if (act==="sp-save"){ saveSpine(); return; }
  if (act==="sp-reset"){ const b=S.books.find(x=>x.id===S.cm.id); S.cm.d={...spineDraftFor({...b, spineManual:false, spineColor: b.spineManual ? "" : b.spineColor, spineTextColor:"", spineFont:"", spineH:null, spineW:null})}; renderModal(); return; }
  if (act==="sp-color-auto"){ S.cm.d.colorManual=false; renderModal(); return; }
  if (act==="sp-text-auto"){ S.cm.d.textManual=false; renderModal(); return; }
  if (act==="sp-h-auto"){ S.cm.d.height=null; renderModal(); return; }
  if (act==="sp-w-auto"){ S.cm.d.width=null; renderModal(); return; }
  if (act==="covers"){ const b=S.books.find(x=>x.id===S.openId); if(!b) return; S.cm={type:"covers", id:b.id, q:`${String(b.title).replace(/\(.*?\)/g,"").trim()} ${b.author||""}`.trim(), results:[], loading:true}; renderModal(); runCoverSearch(); return; }
  if (act==="close-covers"){ const id=S.cm?.id; S.cm=null; S.openId=id||null; renderModal(); return; }
  if (act==="cover-pick"){ pickCover(Number(el.dataset.i)); return; }
  if (act==="cover-plain"){ const id=S.cm.id; const b=S.books.find(x=>x.id===id); S.cm=null; S.openId=id; renderModal(); if(b){ const {id:_x,...rest}=b; await saveBook(id,{...rest, coverUrl:"", olCover:"", coverId:null, ...(b.spineManual ? {} : {spineColor:"", spineText:"", spineFor:""})}); if (b.coverId && S.assets) S.assets.delete(b.coverId).catch(()=>{}); toast("Using a plain color cover"); render(); } return; }
  if (act==="cover-photo"){ const id=S.cm.id; const b=S.books.find(x=>x.id===id); S.cm=null; S.openId=id; if(b){ S.draft={...blank(),...b}; S.editing=true; S.ol=freshOl(); S.err=""; } renderModal(); setTimeout(()=>$("#coverFile")?.focus(),50); return; }
  if (act==="ol-lookup"){ const b=S.books.find(x=>x.id===S.openId); if(!b) return; S.draft={...blank(),...b}; S.editing=true; S.err=""; S.ol=freshOl(`${b.title} ${b.author||""}`.trim()); renderModal(); runOlSearch(); return; }
  if (act==="chal-new"){ S.cm={type:"form", id:null, paste:false, draft:{name:"",description:"",startDate:"",endDate:"",prompts:Array(12).fill(""),slots:[]}}; renderModal(); setTimeout(()=>$("#c-name")?.focus(),30); return; }
  if (act==="chal-edit"){ const c=S.challenges.find(x=>x.id===el.dataset.cid); if(!c) return;
    S.cm={type:"form", id:c.id, paste:false, draft:{name:c.name||"",description:c.description||"",startDate:c.startDate||"",endDate:c.endDate||"",prompts:(c.slots||[]).map(s=>s.prompt||""),slots:(c.slots||[]).map(s=>({...s})),createdAt:c.createdAt}}; renderModal(); return; }
  if (act==="chal-paste-toggle"){ readChal(); S.cm.paste=!S.cm.paste; resizePrompts(S.cm.draft.prompts.length); renderModal(); return; }
  if (act==="chal-disarm"){ S.cm.armed=false; renderModal(); return; }
  if (act==="chal-delete"){ if(!S.cm.armed){ readChal(); S.cm.armed=true; renderModal(); return; }
    try { await S.db.collection("challenges").doc(S.cm.id).delete(); S.cm=null; toast("Challenge deleted"); } catch(err){ S.cm.err=writeErr(err); }
    render(); return; }
  if (act==="pick"){ S.cm={type:"pick", cid:el.dataset.cid, i:Number(el.dataset.i), q:""}; S.openId=null; renderModal(); return; }
  if (act==="slot-set"){ const m=S.cm; S.cm=null; renderModal(); await setSlot(m.cid, m.i, el.dataset.id); toast("Added to the challenge"); return; }
  if (act==="slot-clear"){ const m=S.cm; S.cm=null; renderModal(); await setSlot(m.cid, m.i, null); toast("Spot emptied"); return; }
  if (act==="slot-newbook"){ S.pendingSlot={cid:S.cm.cid, i:S.cm.i}; S.cm=null; S.openId="new"; S.editing=true; S.draft=blank(); S.ol=freshOl(); S.err=""; renderModal(); setTimeout(()=>$("#olq")?.focus(),30); return; }
  if (act==="goto-chal"){ S.openId=null; S.tab="chal"; render(); return; }
  if (act==="open"){ if (S.sum) S.sum.ctl?.abort?.(); S.sum=null; S.cm=null; S.openId=el.dataset.id; S.editing=false; S.armedDelete=false; S.err=""; renderModal(); return; }
  if (act==="close"){ if (S.imp?.stage==="running") return; if (S.sum) S.sum.ctl?.abort?.(); S.sum=null; S.openId=null; S.editing=false; S.err=""; S.imp=null; S.cm=null; S.pendingSlot=null; renderModal(); return; }
  if (act==="import"){ S.cm=null; S.openId="import"; S.imp={stage:"choose"}; renderModal(); return; }
  if (act==="imp-back"){ S.imp={stage:"choose"}; renderModal(); return; }
  if (act==="imp-run"){ runImport(); return; }
  if (act==="imp-dash" || act==="imp-lib"){ S.tab = act==="imp-dash"?"dash":"lib"; S.openId=null; S.imp=null; render(); return; }
  if (act==="summarize"){ runSummary(S.openId, !!el.dataset.redo); return; }
  if (act==="sum-stop"){ S.sum?.ctl?.abort(); return; }
  if (act==="sum-dismiss"){ S.sum=null; renderModal(); return; }
  if (act==="new"){ S.openId="new"; S.editing=true; S.draft=blank(); S.ol=freshOl(); S.err=""; renderModal(); setTimeout(()=>$("#olq")?.focus(),30); return; }
  if (act==="edit"){ const b=S.books.find(x=>x.id===S.openId); S.draft={...blank(),...b}; S.editing=true; S.ol=freshOl(); S.err=""; renderModal(); return; }
  if (act==="cancel-edit"){ if(S.openId==="new"){ S.openId=null; S.pendingSlot=null; } S.editing=false; S.err=""; renderModal(); return; }
  if (act==="hue"){ readForm(); S.draft.hue=Number(el.dataset.h); renderModal(); return; }
  if (act==="remove-cover"){ readForm(); S.draft.coverId=null; renderModal(); return; }
  if (act==="fstatus"){ S.fStatus=el.dataset.v; document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.v===S.fStatus))); renderGrid(); return; }
  if (act==="edit-goal"){ S.editingGoal=true; render(); setTimeout(()=>$("#goalInput")?.focus(),20); return; }
  if (act==="cancel-goal"){ S.editingGoal=false; render(); return; }
  if (act==="save-goal"){
    const v = Number($("#goalInput").value); if(!(v>0)) { $("#goalInput").focus(); return; }
    const goals = {...(S.settings.goals||{}), [S.year]: v};
    try { await S.db.doc("settings/main").set({...S.settings, goals}); S.editingGoal=false; toast(`Goal set: ${v} books`); }
    catch(err){ toast(writeErr(err)); }
    render(); return;
  }
  if (act==="save-page"){ const v=Number($("#curPage").value)||0; await patch(S.openId,{currentPage:v}); toast("Progress saved"); return; }
  if (act==="finish"){ const b=S.books.find(x=>x.id===S.openId); await patch(S.openId,{status:"finished",finishDate:today(),currentPage:b.pages||b.currentPage||""}); toast("Finished! It's on your shelf."); return; }
  if (act==="start"){ await patch(S.openId,{status:"reading",startDate:today()}); toast("Happy reading"); return; }
  if (act==="disarm"){ S.armedDelete=false; renderModal(); return; }
  if (act==="delete"){
    if(!S.armedDelete){ S.armedDelete=true; renderModal(); return; }
    const b = S.books.find(x=>x.id===S.openId);
    try {
      await S.db.collection("books").doc(S.openId).delete();
      if (b?.coverId && S.assets) S.assets.delete(b.coverId).catch(()=>{});
      S.openId=null; S.armedDelete=false; toast("Book deleted");
    } catch(err){ S.err = writeErr(err); }
    render(); return;
  }
  if (act==="clear-examples"){
    S.busy=true; renderNotice();
    for (const b of S.books.filter(x=>x.example)){ try { await S.db.collection("books").doc(b.id).delete(); } catch(err){ toast(writeErr(err)); break; } }
    S.busy=false; toast("Samples removed"); render(); return;
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id==="coverSearch"){ e.preventDefault(); S.cm.q = $("#coverQ").value.trim() || S.cm.q; runCoverSearch(); return; }
  if (e.target.id==="chalForm"){ e.preventDefault(); saveChallenge(); return; }
  if (e.target.id!=="bookForm") return;
  e.preventDefault(); readForm();
  if (!S.draft.title.trim()){ S.err="Give the book a title."; renderModal(); return; }
  const data = clean(S.draft); delete data.example;
  S.busy=true; S.err=""; renderModal();
  try {
    const id = await saveBook(S.openId==="new"?null:S.openId, data);
    S.openId = id; S.justSaved = id; S.editing=false; toast(S.draft.title.trim()+" saved");
    if (S.pendingSlot){ const ps=S.pendingSlot; S.pendingSlot=null; await setSlot(ps.cid, ps.i, id); S.openId=null; S.tab="chal"; toast("Added to the challenge"); }
  } catch(err){ S.err = writeErr(err); }
  S.busy=false; render();
});

document.addEventListener("change", async e => {
  if (e.target.id==="yearSel"){ S.year=Number(e.target.value); S.editingGoal=false; S.arranging=false; render(); }
  if (e.target.id==="sp-font" && S.cm?.type==="spine"){ S.cm.d.font = e.target.value; refreshSpinePreview(); }
  if (e.target.id==="spineColorIn" && S.openId){ const v=e.target.value; await patch(S.openId, {spineColor:v, spineText:textOn(v), spineManual:true}); toast("Spine color saved"); }
  if (e.target.id==="fGenre"){ S.fGenre=e.target.value; renderGrid(); }
  if (e.target.id==="sort"){ S.sort=e.target.value; renderGrid(); }
  if (e.target.id==="fChal"){ S.fChal=e.target.value; renderGrid(); }
  if (e.target.id==="c-count" && S.cm?.type==="form"){ readChal(); resizePrompts(Number(e.target.value)); renderModal(); $("#c-count")?.focus(); }
  if (e.target.id==="c-paste" && S.cm?.type==="form"){ readChal(); resizePrompts(S.cm.draft.prompts.length); renderModal(); }
  if (e.target.id==="impTbr" && S.imp){ S.imp.includeTbr = e.target.checked; renderModal(); }
  if (e.target.id==="impSamples" && S.imp){ S.imp.dropSamples = e.target.checked; }
  if (e.target.id==="importFile" && e.target.files[0]){
    try { S.imp = planImport(await e.target.files[0].text()); }
    catch(err){ S.imp = {stage:"choose", err: err.message || "That file couldn't be read."}; }
    renderModal();
  }
  if (e.target.id==="coverFile" && e.target.files[0] && S.assets){
    readForm(); const file=e.target.files[0];
    $("#coverPreview").style.opacity=".5";
    try {
      const blob = await shrink(file);
      const r = await S.assets.upload(blob,{type:"image/jpeg"});
      S.draft.coverId = r.id; S.err="";
    } catch(err){
      S.err = err?.code==="too_large" ? "That image is too large. Try a smaller photo." : err?.code==="unsupported_type" ? "Use a JPG, PNG or WebP image." : "The cover didn't upload. Try again.";
    }
    renderModal();
  }
});
document.addEventListener("input", e => {
  if (S.cm?.type==="spine" && e.target.closest && e.target.closest("#spineForm")){
    const d = S.cm.d, id = e.target.id, v = e.target.value;
    if (id==="sp-color"){ d.colorManual = true; d.color = v; }
    if (id==="sp-text"){ d.textManual = true; d.textColor = v; }
    if (id==="sp-font"){ d.font = v; }
    if (id==="sp-h"){ d.height = Number(v); }
    if (id==="sp-w"){ d.width = Number(v); }
    refreshSpinePreview();
    // show that the control is now set by hand
    const tag = e.target.parentNode.querySelector(".sc-tag"); if (tag && id!=="sp-font"){ const btn=document.createElement("button"); btn.type="button"; btn.className="linkish"; btn.textContent = id==="sp-color" ? "Match cover" : "Auto"; btn.dataset.act = {"sp-color":"sp-color-auto","sp-text":"sp-text-auto","sp-h":"sp-h-auto","sp-w":"sp-w-auto"}[id]; tag.replaceWith(btn); }
    return;
  }
  if (e.target.id==="olq" && S.ol){ S.ol.q=e.target.value; S.ol.picked=false; clearTimeout(S.ol.t); S.ol.t=setTimeout(runOlSearch, 450); }
  if (e.target.id==="q"){ S.q=e.target.value; renderGrid(); }
  if (e.target.id==="pickQ" && S.cm){ S.cm.q=e.target.value; $("#pickList").innerHTML = pickListHTML(); }
});
function dismiss(){ if (S.imp?.stage==="running") return; if (S.sum) S.sum.ctl?.abort?.(); S.sum=null; S.imp=null; S.cm=null; S.pendingSlot=null; S.openId=null; S.editing=false; renderModal(); }
/* shelf rearranging: drag with mouse or finger, or arrow keys */
function saveShelfOrder(){
  const ids = [...document.querySelectorAll("#shelf .slot[data-id]")].map(x => x.dataset.id);
  const shelfOrder = {...(S.settings.shelfOrder || {}), [S.year]: ids};
  S.settings = {...S.settings, shelfOrder};
  S.db?.doc("settings/main").set(S.settings).catch(err => toast(writeErr(err)));
}
document.addEventListener("pointerdown", e => {
  if (!S.arranging) return;
  const slot = e.target.closest("#shelf .slot[data-id]"); if (!slot) return;
  e.preventDefault(); shelfDrag = {slot, moved:false}; slot.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!shelfDrag) return; e.preventDefault();
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const over = el && el.closest("#shelf .slot[data-id]");
  if (!over || over === shelfDrag.slot) return;
  const r = over.getBoundingClientRect(); const after = e.clientX > r.left + r.width / 2;
  over.parentNode.insertBefore(shelfDrag.slot, after ? over.nextSibling : over); shelfDrag.moved = true;
}, {passive:false});
const endDrag = () => { if (!shelfDrag) return; const d = shelfDrag; shelfDrag = null; d.slot.classList.remove("dragging"); if (d.moved) saveShelfOrder(); };
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);
document.addEventListener("keydown", e => {
  if (!S.arranging || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  const slot = e.target.closest && e.target.closest("#shelf .slot[data-id]"); if (!slot) return;
  e.preventDefault();
  const sib = e.key === "ArrowLeft" ? slot.previousElementSibling : slot.nextElementSibling;
  if (!sib || !sib.dataset.id) return;
  slot.parentNode.insertBefore(slot, e.key === "ArrowLeft" ? sib : sib.nextSibling);
  slot.querySelector(".spine").focus(); saveShelfOrder();
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && (S.openId||S.cm)) dismiss();
  if (e.key==="Enter" && e.target.id==="olq"){ e.preventDefault(); clearTimeout(S.ol.t); runOlSearch(); }
});
window.addEventListener("ns-write-error", e => toast(writeErr(e.detail)));
const setOnline = () => { const o=$("#offline"); if(o) o.hidden = navigator.onLine; };
window.addEventListener("online", setOnline); window.addEventListener("offline", setOnline);
if ("serviceWorker" in navigator && location.protocol==="https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
$("#scrim").addEventListener("click", e => { if (e.target.id==="scrim") dismiss(); });

/* ---------- boot ---------- */
function stopListening(){ S.unsubs.forEach(u => { try { u(); } catch {} }); S.unsubs = []; }
function denied(err){
  if (err?.code === "permission-denied") window.NSAuth?.signOut("That Google account isn't allowed in this journal. Sign in with the account named in your Firebase rules, or check the email there (setup guide, Part 2).");
}
window.NSApp = {
  start(ctx){
    stopListening();
    S.db = ctx.db; S.assets = ctx.assets; S.user = ctx.user; S.canWrite = true; S.noDb = false; S.loaded = false;
    S.books = []; S.challenges = []; S.coverMap = {}; S.settings = {goals:{}};
    $("#signin").hidden = true; $("#app").hidden = false; setOnline();
    const ab = $("#acctBtn"); ab.textContent = (ctx.user.name || ctx.user.email || "?")[0].toUpperCase();
    if (ctx.user.photo){ ab.innerHTML = `<img src="${esc(ctx.user.photo)}" alt="" referrerpolicy="no-referrer">`; }
    S.unsubs.push(S.db.collection("books").onSnapshot(snap => {
      S.books = snap.docs.map(d => ({id:d.id, ...d.data()})); S.loaded = true;
      if (S.editing) readForm();
      if (S.cm?.type==="form") readChal();
      if (S.cm?.type==="bulk" || S.cm?.type==="account"){ if (S.tab!=="chal") $("#view").innerHTML = S.tab==="dash" ? dashHTML() : libHTML(), S.tab==="lib" && renderGrid(); else $("#view").innerHTML = chalHTML(); return; }
      if (S.editing && document.activeElement && document.activeElement.closest && document.activeElement.closest("#bookForm")) { $("#view").innerHTML = S.tab==="dash" ? dashHTML() : S.tab==="chal" ? chalHTML() : libHTML(); if (S.tab==="lib") renderGrid(); return; }
      render();
    }, err => { S.loaded = true; denied(err); render(); }));
    S.unsubs.push(S.db.collection("challenges").onSnapshot(snap => {
      S.challenges = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (S.cm?.type==="form") readChal();
      if (S.cm?.type==="pick"){ const q=$("#pickQ"); if (q && document.activeElement===q){ if (S.tab==="chal") $("#view").innerHTML = chalHTML(); return; } }
      if (S.editing || S.cm) { $("#view").innerHTML = S.tab==="dash" ? dashHTML() : S.tab==="chal" ? chalHTML() : libHTML(); if (S.tab==="lib") renderGrid(); return; }
      render();
    }, ()=>{}));
    S.unsubs.push(S.db.collection("covers").onSnapshot(snap => {
      S.coverMap = Object.fromEntries(snap.docs.map(d => [d.id, d.data().data]));
      if (!S.editing && !S.cm) render();
    }, ()=>{}));
    S.unsubs.push(S.db.doc("settings/main").onSnapshot(snap => { S.settings = snap.exists ? snap.data() : {goals:{}}; if (S.editing || S.cm) return; if(!S.editingGoal) render(); }, ()=>{}));
    render();
  },
  signedOut(msg){
    stopListening(); S.db = null; S.books = []; S.challenges = []; S.loaded = false; S.openId = null; S.cm = null; S.imp = null; S.editing = false;
    renderModal();
    $("#app").hidden = true; $("#signin").hidden = false;
    const btn = $("#signinBtn"); btn.hidden = false; btn.disabled = false;
    $("#signinMsg").textContent = msg || "";
  }
};
render();
})();
</script>

<script type="module">
import { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut,
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "./firebase.bundle.js";

const fail = msg => window.NSApp.signedOut(msg);
const cfg = window.FIREBASE_CONFIG;
if (!cfg || !cfg.apiKey) fail("This copy of Nightstand is missing its Firebase settings in config.js.");
else {
  const app = initializeApp(cfg);
  const auth = getAuth(app);
  let fs;
  try { fs = initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch { fs = initializeFirestore(app, { ignoreUndefinedProperties: true }); }

  // Writes land in the local cache at once; offline they sync later, so don't wait on the server forever.
  const soft = p => { p.catch(e => window.dispatchEvent(new CustomEvent("ns-write-error", { detail: e }))); return navigator.onLine ? Promise.race([p, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve(); };
  const wrapDoc = r => ({
    id: r.id,
    set: data => soft(setDoc(r, data)),
    delete: () => soft(deleteDoc(r)),
    onSnapshot: (next, err) => onSnapshot(r, s => next({ id: s.id, exists: s.exists(), data: () => s.data() }), err)
  });
  const makeCtx = uid => {
    const db = {
      collection: name => { const c = collection(fs, "users", uid, name); return {
        doc: id => wrapDoc(id ? doc(c, id) : doc(c)),
        onSnapshot: (next, err) => onSnapshot(c, s => next({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) }), err) }; },
      doc: path => { const [col, id] = path.split("/"); return wrapDoc(doc(fs, "users", uid, col, id)); }
    };
    const toDataURL = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
    const assets = {
      async upload(blob){ const data = await toDataURL(blob); if (data.length > 900000) throw { code: "too_large" }; const r = doc(collection(fs, "users", uid, "covers")); await soft(setDoc(r, { data, createdAt: Date.now() })); return { id: r.id, url: data }; },
      delete: id => soft(deleteDoc(doc(fs, "users", uid, "covers", id))),
      restore: (id, data) => soft(setDoc(doc(fs, "users", uid, "covers", id), { data, createdAt: Date.now() }))
    };
    return { db, assets };
  };
  const authMsg = e => e?.code === "auth/unauthorized-domain" ? "Sign-in isn't allowed from this address yet. In Firebase, add it under Authentication → Settings → Authorized domains (setup guide, Part 4, step 5)."
    : e?.code === "auth/network-request-failed" ? "You're offline. Connect to the internet to sign in."
    : "Sign-in didn't finish. Try again.";
  window.NSAuth = {
    async signIn(){
      const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
      try { await signInWithPopup(auth, p); }
      catch (e) {
        if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") { try { await signInWithRedirect(auth, p); } catch (e2) { fail(authMsg(e2)); } }
        else if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") fail("");
        else fail(authMsg(e));
      }
    },
    async signOut(msg){ try { await signOut(auth); } catch {} fail(msg || ""); }
  };
  getRedirectResult(auth).catch(e => fail(authMsg(e)));
  onAuthStateChanged(auth, u => {
    if (u) window.NSApp.start({ ...makeCtx(u.uid), user: { email: u.email, name: u.displayName, photo: u.photoURL } });
    else if ($signinPending()) fail("");
  });
  function $signinPending(){ return !document.getElementById("signinBtn").disabled || document.getElementById("signinBtn").hidden; }
}
</script>
